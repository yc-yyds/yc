// 丁达尔效应（白天模式）
var tyndallAnimId = null, tyndallDust = [];
function initTyndallDust(cw, ch) {
  tyndallDust = [];
  for (var i = 0; i < 40; i++) {
    tyndallDust.push({
      x: cw * 0.7 + Math.random() * cw * 0.4,
      y: Math.random() * ch * 0.8,
      size: 1 + Math.random() * 3,
      alpha: 0.2 + Math.random() * 0.5,
      driftX: Math.random() * 2 - 1,
      driftY: Math.random() * 0.8 - 0.4,
      phase: Math.random() * Math.PI * 2
    });
  }
}
function drawTyndall(ctx, cw, ch, time) {
  ctx.clearRect(0, 0, cw, ch);
  var sx = cw + 50, sy = -80;
  for (var i = 0; i < 9; i++) {
    var ba = -0.2 + (i - 4) * 0.055;
    var av = Math.sin(time * 0.25 + i * 1.2) * 0.007;
    var ang = ba + av;
    var bw = 32 + Math.sin(time * 0.35 + i * 0.7) * 9;
    var bl = Math.max(cw, ch) * 1.7;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(ang);
    var grad = ctx.createLinearGradient(0, 0, bl, 0);
    grad.addColorStop(0, 'rgba(255,235,170,' + (0.55 + Math.sin(time * 0.4 + i) * 0.18) + ')');
    grad.addColorStop(0.1, 'rgba(255,220,140,' + (0.35 + Math.sin(time * 0.35 + i * 1.2) * 0.12) + ')');
    grad.addColorStop(0.3, 'rgba(255,200,100,' + (0.18 + Math.sin(time * 0.3 + i * 0.6) * 0.07) + ')');
    grad.addColorStop(0.55, 'rgba(255,180,70,0.06)');
    grad.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.beginPath();
    ctx.moveTo(0, -bw / 2);
    ctx.lineTo(bl * 0.5, -bw * 0.4);
    ctx.lineTo(bl * 0.75, -bw * 0.2);
    ctx.lineTo(bl, bw * 0.25);
    ctx.lineTo(bl * 0.65, bw * 0.45);
    ctx.lineTo(bl * 0.4, bw * 0.35);
    ctx.lineTo(0, bw / 2);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  }
  var sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, 400);
  sg.addColorStop(0, 'rgba(255,235,170,' + (0.7 + Math.sin(time * 0.5) * 0.2) + ')');
  sg.addColorStop(0.25, 'rgba(255,215,120,0.35)');
  sg.addColorStop(0.55, 'rgba(255,195,90,0.1)');
  sg.addColorStop(1, 'rgba(255,180,70,0)');
  ctx.beginPath();
  ctx.arc(sx, sy, 400, 0, Math.PI * 2);
  ctx.fillStyle = sg;
  ctx.fill();
  for (var d = 0; d < tyndallDust.length; d++) {
    var p = tyndallDust[d];
    p.x += p.driftX * 0.25 + Math.sin(time * 0.4 + p.phase) * 0.15;
    p.y += p.driftY * 0.25;
    if (p.y < -10) p.y = ch + 10;
    if (p.y > ch + 10) p.y = -10;
    if (p.x > cw + 20) p.x = cw * 0.55 + Math.random() * cw * 0.35;
    if (p.x < cw * 0.45) p.x = cw * 0.55 + Math.random() * cw * 0.35;
    var al = p.alpha * (0.3 + 0.7 * Math.sin(time * 1.2 + p.phase));
    var gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 3.5);
    gg.addColorStop(0, 'rgba(255,225,150,' + al + ')');
    gg.addColorStop(0.5, 'rgba(255,215,120,' + (al * 0.3) + ')');
    gg.addColorStop(1, 'rgba(255,215,120,0)');
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * 3.5, 0, Math.PI * 2);
    ctx.fillStyle = gg;
    ctx.fill();
  }
}
function initTyndall() {
  var canvas = document.getElementById('tyndallCanvas');
  if (!canvas) return;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var ctx = canvas.getContext('2d');
  initTyndallDust(canvas.width, canvas.height);
  if (tyndallAnimId) cancelAnimationFrame(tyndallAnimId);
  if (document.documentElement.getAttribute('data-theme') !== 'light') return;
  var time = 0;
  function animate() {
    if (document.documentElement.getAttribute('data-theme') !== 'light') {
      cancelAnimationFrame(tyndallAnimId);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }
    time += 0.016;
    drawTyndall(ctx, canvas.width, canvas.height, time);
    tyndallAnimId = requestAnimationFrame(animate);
  }
  animate();
}

function activateTab(tab){
  var tablist=tab.closest('.tabs');
  if(!tablist) return;
  var tabs=tablist.querySelectorAll('.tab');
  var panels=tablist.querySelectorAll('.tabpanel');
  var index=Array.prototype.indexOf.call(tabs,tab);
  for(var i=0;i<tabs.length;i++){
    var active=i===index;
    tabs[i].classList.toggle('active',active);
    tabs[i].setAttribute('aria-selected',active);
    tabs[i].setAttribute('tabindex',active?'0':'-1');
  }
  for(var j=0;j<panels.length;j++){
    var act=j===index;
    panels[j].classList.toggle('active',act);
    panels[j].hidden=!act;
  }
  setTimeout(function(){
    for(var k=0;k<panels.length;k++){
      if(k===index){
        panels[k].querySelectorAll('.fade-in').forEach(function(el){
          el.classList.remove('visible','animate-bounce');
          void el.offsetWidth;
          el.classList.add('visible','animate-bounce');
        });
      }
    }
  },50);
}
function initTheme(){
  var saved=localStorage.getItem('theme');
  var prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme',saved||(prefersDark?'dark':'light'));
}
function toggleTheme(){
  var cur=document.documentElement.getAttribute('data-theme');
  var next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  localStorage.setItem('theme',next);
  if(next==='dark') initStars();
  else initTyndall();
  document.querySelectorAll('.fade-in').forEach(function(el){el.classList.remove('visible','animate-bounce');});
  requestAnimationFrame(initObserver);
}
function copyEmail(btn){
  var email=btn.getAttribute('data-email');
  if(!email) return;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(email).then(function(){btn.textContent='✅ 已复制';setTimeout(function(){btn.textContent='📋 复制邮箱';},2000);});
  } else {
    var ta=document.createElement('textarea'); ta.value=email; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent='✅ 已复制'; setTimeout(function(){btn.textContent='📋 复制邮箱';},2000);
  }
}
function initCertPreview(){
  var preview=document.getElementById('certPreview');
  var img=preview?preview.querySelector('img'):null;
  if(!preview||!img) return;
  document.addEventListener('mouseover',function(e){
    var target=e.target.closest('.cert-hover');
    if(!target) return;
    var src=target.getAttribute('data-cert');
    if(!src) return;
    img.src=src; preview.style.display='block';
  });
  document.addEventListener('mousemove',function(e){
    if(preview.style.display==='block'){
      var off=16, x=e.clientX+off, y=e.clientY+off;
      var r=preview.getBoundingClientRect();
      if(x+r.width>window.innerWidth) x=e.clientX-r.width-off;
      if(y+r.height>window.innerHeight) y=e.clientY-r.height-off;
      preview.style.left=x+'px'; preview.style.top=y+'px';
    }
  });
  document.addEventListener('mouseout',function(e){
    if(e.target.closest('.cert-hover')){preview.style.display='none'; img.src='';}
  });
}
function initInteractions(){
  document.addEventListener('click',function(e){
    var tab=e.target.closest('.tab');
    if(tab){activateTab(tab);return;}
    if(e.target.closest('#themeToggle')){toggleTheme();return;}
    if(e.target.closest('#printBtn')){window.print();return;}
    if(e.target.closest('#backToTop')){window.scrollTo({top:0,behavior:'smooth'});return;}
    if(e.target.closest('#copyEmailBtn')){copyEmail(e.target.closest('#copyEmailBtn'));return;}
  });
  document.addEventListener('keydown',function(e){
    var tablist=e.target.closest('.tabs-nav');
    if(!tablist) return;
    var tabs=tablist.querySelectorAll('.tab');
    var idx=Array.prototype.indexOf.call(tabs,document.activeElement);
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();
      var next;
      if(e.key==='ArrowRight') next=(idx+1)%tabs.length;
      else next=(idx-1+tabs.length)%tabs.length;
      tabs[next].focus(); activateTab(tabs[next]);
    }
  });
  window.addEventListener('scroll',function(){
    var btn=document.getElementById('backToTop');
    if(btn){ if(window.scrollY>300) btn.classList.add('show'); else btn.classList.remove('show'); }
  });
  window.addEventListener('resize',function(){
    var theme=document.documentElement.getAttribute('data-theme');
    if(theme==='dark') initStars(); else initTyndall();
  });
}
function initObserver(){
  var observer=new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting){
        if(!entry.target.classList.contains('visible')){
          entry.target.classList.add('visible');
          setTimeout(function(){entry.target.classList.add('animate-bounce');},50);
        }
      } else {
        entry.target.classList.remove('visible','animate-bounce');
      }
    });
  },{threshold:0.15,rootMargin:'-10px 0px'});
  document.querySelectorAll('.fade-in').forEach(function(el){observer.observe(el);});
}
function init(){
  initTheme();
  buildApp();
  var theme=document.documentElement.getAttribute('data-theme');
  if(theme==='dark') initStars(); else initTyndall();
  initInteractions();
  initObserver();
  initCertPreview();
}
init();
</script>
