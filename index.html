<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif;
  --brand:#4f46e5;--brand-2:#0ea5e9;--brand-soft:rgba(79,70,229,.10);--accent:#f59e0b;
  --bg:#f5f6fb;--card:#fff;--text:#151a2d;--muted:#5b6478;--line:rgba(21,26,45,.09);
  --nav-bg:rgba(255,255,255,.78);--glow1:rgba(79,70,229,.16);--glow2:rgba(14,165,233,.14);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);--shadow:0 10px 30px -14px rgba(16,24,40,.25);
  --shadow-lg:0 24px 50px -24px rgba(16,24,40,.35);--radius:18px;
  /* 背景装饰：网格线 / 极光光晕 / 渐隐遮罩 */
  --grid-line:rgba(21,26,45,.045);--grid-size:56px;
  --aur1:rgba(79,70,229,.30);--aur2:rgba(14,165,233,.26);--aur3:rgba(245,158,11,.14);
  --fade:rgba(245,246,251,0);
}
html[data-theme="dark"]{
  --brand:#818cf8;--brand-2:#38bdf8;--brand-soft:rgba(129,140,248,.14);
  --bg:#070a14;--card:#101627;--text:#e9ecf7;--muted:#98a2bd;--line:rgba(255,255,255,.09);
  --nav-bg:rgba(9,13,24,.72);--glow1:rgba(99,102,241,.22);--glow2:rgba(14,165,233,.18);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);--shadow:0 12px 34px -18px rgba(0,0,0,.9);
  --shadow-lg:0 28px 60px -28px rgba(0,0,0,.95);
  --grid-line:rgba(255,255,255,.055);--grid-size:56px;
  --aur1:rgba(99,102,241,.42);--aur2:rgba(14,165,233,.34);--aur3:rgba(245,158,11,.16);
  --fade:rgba(7,10,20,0);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px;-webkit-text-size-adjust:100%;
  background-color:var(--bg)}
body{margin:0;font-family:var(--font);font-size:15.5px;line-height:1.75;color:var(--text);
  background-color:var(--bg);
  background-image:
    /* 1. 极光光晕：左上主色 · 右上青色 · 中下暖色点缀 */
    radial-gradient(1000px 620px at 6% -10%,var(--aur1),transparent 58%),
    radial-gradient(860px 520px at 98% -4%,var(--aur2),transparent 56%),
    radial-gradient(760px 500px at 78% 44%,var(--aur3),transparent 60%),
    /* 2. 网格织纹：格线 + 交点微亮，增加质感但不抢视 */
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px),
    radial-gradient(circle at 50% 50%,var(--grid-line) 0 1.2px,transparent 1.2px);
  background-size:auto,auto,auto,var(--grid-size) var(--grid-size),var(--grid-size) var(--grid-size),var(--grid-size) var(--grid-size);
  background-attachment:fixed,fixed,fixed,scroll,scroll,scroll;
  background-repeat:no-repeat,no-repeat,no-repeat,repeat,repeat,repeat;
  -webkit-font-smoothing:antialiased;
  transition:background-color .3s ease,color .3s ease;overflow-x:hidden}

/* 网格层向下渐隐：保证正文区域足够干净，注意力集中在重点内容上 */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,var(--fade) 0%,var(--fade) 52%,var(--bg) 100%)}

/* 正文页背景氛围层：固定铺满视口，位于内容之下、body 背景之上
   是 body 的直接子元素，所以 z-index:0 即可稳稳压在 body 背景上、内容之下 */
#pageCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;
  pointer-events:none;display:block}
/* 正文内容抬到氛围层之上（nav/totop 自身已有更高 z-index，不受影响） */
main{position:relative;z-index:1}
@media print{#pageCanvas{display:none!important}}
h1,h2,h3,h4{margin:0;line-height:1.3}
p{margin:0}a{color:inherit}ul{margin:0;padding:0;list-style:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}

/* 开场页锁滚动 */
body.locked{overflow:hidden}
.nav,main,.footer,.totop{transition:opacity .75s ease}
body.locked .nav,body.locked main,body.locked .footer,body.locked .totop{opacity:0;pointer-events:none}
html.intro-skip #intro{display:none!important}
html.intro-skip body.locked{overflow:auto}
html.intro-skip .nav,html.intro-skip main,html.intro-skip .footer,html.intro-skip .totop{opacity:1!important;pointer-events:auto!important}

.wrap{width:min(1080px,100% - 40px);margin-inline:auto}
.wrap-wide{width:min(1200px,100% - 40px);margin-inline:auto}
@media(max-width:640px){.wrap{width:min(1080px,100% - 28px)}.wrap-wide{width:min(1200px,100% - 28px)}}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--brand);color:#fff;padding:10px 18px;border-radius:0 0 10px 0;font-weight:700;text-decoration:none}
.skip:focus{left:0}
.ico-wrap{display:inline-flex;align-items:center;flex:0 0 auto}

/* ============ 开场页 ============ */
#intro{position:fixed;inset:0;z-index:1000;overflow:hidden;
  background:radial-gradient(ellipse 62% 56% at 50% 42%,#141b3d 0%,#080c1c 46%,#02030a 100%);
  opacity:1;visibility:visible;transition:opacity .85s ease,visibility .85s ease;
  -webkit-user-select:none;user-select:none}
#intro.hidden{opacity:0;visibility:hidden;pointer-events:none}
#starCanvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#starCanvas:active{cursor:grabbing}
.intro-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px;text-align:center;pointer-events:none}
.intro-kicker{font-size:.68rem;font-weight:700;letter-spacing:.52em;text-indent:.52em;color:rgba(129,140,248,.82);text-transform:uppercase;animation:introIn .8s cubic-bezier(.22,.7,.25,1) .1s both}
.intro-title{max-width:15em;font-size:clamp(1.45rem,4.8vw,2.85rem);font-weight:800;line-height:1.42;letter-spacing:.01em;
  background:linear-gradient(118deg,#eef2ff 0%,#a5b4fc 46%,#7dd3fc 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(129,140,248,.45));
  animation:introIn .9s cubic-bezier(.22,.7,.25,1) .22s both}
.intro-sub{font-size:.82rem;font-weight:600;letter-spacing:.16em;color:rgba(148,163,184,.78);animation:introIn .9s cubic-bezier(.22,.7,.25,1) .38s both}
.intro-btn-wrap{pointer-events:auto;margin-top:12px;animation:introIn .9s cubic-bezier(.22,.7,.25,1) .5s both}
.intro-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:15px 58px;border-radius:999px;
  border:1px solid rgba(165,180,252,.6);
  background:linear-gradient(135deg,rgba(79,70,229,.92),rgba(14,165,233,.9));
  color:#fff;font-size:1rem;font-weight:750;letter-spacing:.24em;text-indent:.24em;cursor:pointer;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:transform .22s ease,border-color .22s ease;
  animation:breathe 2.8s ease-in-out 1.35s infinite}
.intro-btn::before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:skewX(-18deg);animation:sheen 3.6s ease-in-out 1.8s infinite;pointer-events:none}
.intro-btn:hover{transform:translateY(-2px) scale(1.03);border-color:rgba(199,210,254,.95)}
.intro-btn:active{transform:translateY(0) scale(.99)}
@keyframes introIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(129,140,248,.5),0 0 24px rgba(99,102,241,.5),inset 0 1px 0 rgba(255,255,255,.22)}
  50%{box-shadow:0 0 0 18px rgba(129,140,248,0),0 0 56px rgba(99,102,241,.85),inset 0 1px 0 rgba(255,255,255,.34)}}
@keyframes sheen{0%{left:-70%}45%{left:130%}100%{left:130%}}
@media(max-width:640px){.intro-btn{padding:13px 42px;font-size:.92rem;letter-spacing:.18em;text-indent:.18em}.intro-sub{font-size:.74rem;letter-spacing:.1em}}

/* ============ 导航 ============ */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--nav-bg);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .25s ease,box-shadow .25s ease,background-color .3s ease,opacity .75s ease}
.nav.scrolled{border-bottom-color:var(--line);box-shadow:0 6px 24px -18px rgba(16,24,40,.5)}
.nav-inner{width:min(1080px,100% - 40px);margin-inline:auto;height:64px;display:flex;align-items:center;gap:12px}
@media(max-width:640px){.nav-inner{width:min(1080px,100% - 24px);gap:8px}}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:0 0 auto}
.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 18px -10px rgba(79,70,229,.9);overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-size:.94rem;font-weight:800;letter-spacing:.02em}
.brand-text small{font-size:.68rem;color:var(--muted);letter-spacing:.06em}
@media(max-width:860px){.brand-text{display:none}}
.nav-links{display:flex;align-items:center;gap:2px;margin-left:auto;min-width:0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{padding:7px 13px;border-radius:999px;font-size:.86rem;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap;transition:color .18s ease,background-color .18s ease}
.nav-link:hover,.nav-link.active{color:var(--brand);background:var(--brand-soft)}
@media(max-width:640px){.nav-link{padding:6px 10px;font-size:.79rem}}
.nav-actions{display:flex;gap:6px;flex:0 0 auto}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:transform .18s ease,color .18s ease,border-color .18s ease}
.icon-btn:hover{color:var(--brand);border-color:var(--brand);transform:translateY(-2px)}
.icon-btn:active{transform:translateY(0)}

/* ============ 通用 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid transparent;font-size:.88rem;font-weight:650;cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .18s ease,box-shadow .18s ease,color .18s ease,border-color .18s ease}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:0 10px 24px -12px rgba(79,70,229,.95)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 34px -14px rgba(79,70,229,1)}
.section{padding:54px 0 6px}
.sec-title{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
/* 图标底：圆角方块，替代原来的竖色条 */
.sec-ico{width:36px;height:36px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;
  color:var(--brand);background:var(--brand-soft);border:1px solid var(--line);
  box-shadow:0 4px 12px -6px var(--brand);
  transition:transform .25s ease,background-color .25s ease}
.sec-title:hover .sec-ico{transform:rotate(-6deg) scale(1.06)}
.sec-title h2{font-size:1.28rem;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:11px}
.sec-title .sec-sub{font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-left:2px}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;color:var(--brand);background:var(--brand-soft);border:1px solid var(--line);white-space:nowrap}
.time{font-size:.76rem;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:4px 11px;border-radius:999px;white-space:nowrap;border:1px solid var(--line)}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease}
.reveal.in{opacity:1;transform:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ 两侧边缘装饰（仅宽屏可见，不遮挡正文） ============ */
.edge{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
/* 内容宽度 1080px，两侧留白 = (100vw - 1080px)/2；1440px 以上才有 ≥180px 可用 */
@media(min-width:1440px){.edge{display:block}}
.edge i{position:absolute;display:block}

/* —— 柔和光斑，压在最底层做氛围 —— */
.edge .e-orb{width:340px;height:340px;border-radius:50%;filter:blur(46px);opacity:.5}
.edge .e-orb.o1{left:-150px;top:16vh;background:radial-gradient(circle,var(--aur1),transparent 66%)}
.edge .e-orb.o2{right:-160px;top:48vh;background:radial-gradient(circle,var(--aur2),transparent 66%);animation:orbFloat 22s ease-in-out infinite}
.edge .e-orb.o3{left:-120px;bottom:6vh;background:radial-gradient(circle,var(--aur3),transparent 66%);animation:orbFloat 27s ease-in-out 3s infinite reverse}
@keyframes orbFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(14px,-34px,0)}}

/* —— 刻度尺：像地图坐标轴，呼应 GIS 专业 —— */
.edge .e-ruler{top:14vh;bottom:14vh;width:22px;opacity:.5}
.edge .e-ruler.l{left:44px;border-left:1px solid var(--line)}
.edge .e-ruler.r{right:44px;border-right:1px solid var(--line)}
.edge .e-ruler span{position:absolute;height:1px;background:var(--line)}
/* 左侧刻度向右伸出，右侧刻度向左伸出 */
.edge .e-ruler.l span{left:0}
.edge .e-ruler.r span{right:0}
.edge .e-ruler span.tick{width:9px}
.edge .e-ruler span.minor{width:5px;opacity:.55}
.edge .e-ruler span.major{width:14px;background:linear-gradient(90deg,var(--brand),var(--line))}
.edge .e-ruler.r span.major{background:linear-gradient(270deg,var(--brand),var(--line))}

/* —— 悬浮标签：竖排文字，弱化存在感 —— */
.edge .e-tag{position:absolute;font-size:.62rem;font-weight:700;letter-spacing:.34em;
  color:var(--muted);opacity:.42;text-transform:uppercase;white-space:nowrap}
.edge .e-tag.l{left:50px;transform:rotate(180deg);writing-mode:vertical-rl}
.edge .e-tag.r{right:50px;writing-mode:vertical-rl}
.edge .e-tag.t1{top:22vh}
.edge .e-tag.t2{bottom:24vh}
.edge .e-tag .dot{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));margin-bottom:10px;
  box-shadow:0 0 0 4px var(--brand-soft)}

/* —— 几何描边图形：极细线，纯装饰 —— */
.edge .e-shape{opacity:.3}
.edge .e-shape circle,.edge .e-shape rect,.edge .e-shape path,.edge .e-shape line{
  fill:none;stroke:var(--brand);stroke-width:1}
.edge .e-shape .dim{stroke:var(--line)}
.edge .e-sh1{left:38px;top:6vh;width:120px;height:120px;animation:spinSlow 90s linear infinite}
.edge .e-sh2{right:34px;bottom:10vh;width:150px;height:150px;animation:spinSlow 120s linear infinite reverse}
.edge .e-sh3{right:70px;top:9vh;width:80px;height:80px;opacity:.22}
.edge .e-sh4{left:74px;bottom:12vh;width:96px;height:96px;opacity:.22;animation:driftSlow 34s ease-in-out infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes driftSlow{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(0,-20px,0) rotate(12deg)}}

/* —— 角落强调色块 —— */
.edge .e-corner{width:120px;height:120px;border:1px solid var(--line);opacity:.55}
.edge .e-corner.tl{left:26px;top:26px;border-right-color:var(--brand);border-bottom-color:var(--brand);border-radius:0 0 0 22px}
.edge .e-corner.br{right:26px;bottom:26px;border-left-color:var(--brand);border-top-color:var(--brand);border-radius:22px 0 0 0}

/* 移动端 / 打印不显示装饰 */
@media(max-width:1439px){.edge{display:none!important}}
@media print{.edge{display:none!important}}

.pulse{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:0 0 auto;box-shadow:0 0 0 0 rgba(34,197,94,.55);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

/* ============ Hero（含大头照） ============ */
.hero{padding:104px 0 6px;position:relative}
/* 主视觉光晕：让首屏卡片成为第一眼焦点 */
.hero::before{content:"";position:absolute;left:50%;top:-90px;transform:translateX(-50%);
  width:min(1180px,120%);height:520px;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 58% 62% at 50% 50%,var(--glow1),transparent 70%);
  filter:blur(6px)}
.hero > .wrap{position:relative;z-index:1}
.hero-card{position:relative;overflow:hidden;border-radius:26px;padding:clamp(24px,4vw,46px);
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:var(--shadow-lg),0 0 0 1px var(--brand-soft) inset;
  -webkit-backdrop-filter:saturate(140%) blur(2px);backdrop-filter:saturate(140%) blur(2px)}
.hero-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--brand-2),var(--accent))}
/* 双层光斑：右下暖调 + 左上主色，营造质感 */
.hero-card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 88% 108%,var(--glow1),transparent 58%),
    radial-gradient(circle at 6% -14%,var(--glow2),transparent 52%),
    linear-gradient(180deg,transparent 62%,var(--brand-soft))}
.hero-inner{position:relative;z-index:1}

.hero-grid{
  display:grid;
  gap:clamp(22px,3.6vw,44px);
  grid-template-columns:minmax(0,1fr) 196px;
  align-items:start;
}
@media(max-width:880px){
  .hero-grid{grid-template-columns:1fr;gap:24px}
  .hero-avatar{order:-1;justify-self:center}
}

/* —— 大头照 —— */
.hero-avatar{position:relative;justify-self:end}
.avatar-ring{
  position:relative;
  width:196px;height:196px;border-radius:50%;
  padding:5px;
  background:linear-gradient(140deg,var(--brand),var(--brand-2) 55%,var(--accent));
  box-shadow:0 22px 48px -22px rgba(79,70,229,.9);
  transition:transform .3s ease,box-shadow .3s ease;
}
.avatar-ring::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1px dashed var(--line);
}
.hero-avatar:hover .avatar-ring{
  transform:translateY(-4px) scale(1.015);
  box-shadow:0 30px 60px -26px rgba(79,70,229,1);
}
.avatar-ring img{
  width:100%;height:100%;border-radius:50%;
  object-fit:cover;object-position:center 22%;
  display:block;
  background:var(--brand-soft);
  transition:transform .4s ease;
}
.hero-avatar:hover .avatar-ring img{transform:scale(1.045)}
.avatar-ring.failed{
  background:var(--brand-soft);
  box-shadow:none;
}
.avatar-ring.failed::before{
  content:"照片未找到";
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:.72rem;font-weight:700;color:var(--muted);
  z-index:2;white-space:nowrap;
}
.avatar-ring.failed img{opacity:0}

.avatar-badge{
  position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 14px;border-radius:999px;
  font-size:.72rem;font-weight:800;letter-spacing:.02em;
  color:#fff;white-space:nowrap;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 10px 22px -12px rgba(79,70,229,.95);
  border:2px solid var(--card);
  z-index:3;
}
@media(max-width:880px){
  .avatar-ring{width:158px;height:158px}
  .avatar-badge{font-size:.68rem;padding:4px 12px}
}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:650;color:var(--muted);background:var(--brand-soft);border:1px solid var(--line);padding:5px 14px;border-radius:999px}
.hero-name{margin:16px 0 6px;font-size:clamp(2.1rem,5.4vw,3.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.12;
  background:linear-gradient(118deg,var(--text) 22%,var(--brand) 62%,var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-headline{font-size:clamp(.98rem,2vw,1.12rem);font-weight:700;color:var(--brand);letter-spacing:.01em}
.hero-summary{margin-top:14px;max-width:66ch;font-size:.93rem;color:var(--muted);line-height:1.9}

.contact-bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.contact-item{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:.84rem;font-weight:650;text-decoration:none;cursor:pointer;white-space:nowrap;transition:transform .18s ease,color .18s ease,border-color .18s ease,box-shadow .18s ease}
.contact-item .ico-wrap{color:var(--brand)}
.contact-item:hover{transform:translateY(-2px);border-color:var(--brand);color:var(--brand);box-shadow:var(--shadow-sm)}
.contact-item.static{cursor:default}
.contact-item.static:hover{transform:none;color:var(--text);border-color:var(--line);box-shadow:none}
.contact-item .copy-hint{font-size:.72rem;color:var(--muted);font-weight:600}
.contact-item:hover .copy-hint{color:var(--brand)}
@media(max-width:640px){.contact-item{padding:8px 13px;font-size:.79rem}}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tag{display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;font-size:.78rem;font-weight:600;color:var(--muted);background:var(--brand-soft);border:1px solid var(--line);transition:transform .18s ease,color .18s ease,border-color .18s ease}
.tag:hover{transform:translateY(-2px);color:var(--brand);border-color:var(--brand)}

/* ============ 亮点 ============ */
.stats{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:20px 20px 18px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm);position:relative;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.stat::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));transform:scaleX(0);transform-origin:left;transition:transform .35s ease}
.stat:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--brand)}
.stat:hover::after{transform:scaleX(1)}
/* 右上角序号水印，强化“四张并列”的秩序感 */
.stat .st-idx{position:absolute;top:12px;right:14px;font-size:.68rem;font-weight:800;
  letter-spacing:.1em;color:var(--brand);opacity:.3;font-variant-numeric:tabular-nums}
/* 背景装饰弧线 */
.stat .st-arc{position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;
  border:1px solid var(--line);pointer-events:none}
.stat .st-arc::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed var(--line)}
.stat .num{font-size:clamp(1.7rem,3.2vw,2.2rem);font-weight:800;line-height:1;color:var(--brand);letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px}
.stat .num span{font-size:.85rem;font-weight:700;margin-left:2px;color:var(--muted)}
/* 底部迷你柱状装饰 */
.stat .st-spark{display:flex;align-items:flex-end;gap:3px;height:18px;margin-top:12px}
.stat .st-spark i{flex:1 1 0;border-radius:2px 2px 0 0;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));opacity:.28;
  transform-origin:bottom;transform:scaleY(.2);transition:transform .7s cubic-bezier(.22,.7,.25,1)}
.stat:hover .st-spark i{opacity:.5}
.reveal.in .stat .st-spark i{transform:scaleY(1)}
.stat .st-spark i:nth-child(1){transition-delay:.05s}
.stat .st-spark i:nth-child(2){transition-delay:.10s}
.stat .st-spark i:nth-child(3){transition-delay:.15s}
.stat .st-spark i:nth-child(4){transition-delay:.20s}
.stat .st-spark i:nth-child(5){transition-delay:.25s}
.stat .st-spark i:nth-child(6){transition-delay:.30s}
.stat .st-title{font-size:.9rem;font-weight:700;margin-top:10px}
.stat .st-desc{font-size:.79rem;color:var(--muted);line-height:1.65;margin-top:4px}

/* ============ 证书（分组 + 筛选） ============ */
.award-filter{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.af-btn{padding:6px 15px;border-radius:999px;font-size:.79rem;font-weight:650;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--muted);
  transition:transform .18s ease,color .18s ease,border-color .18s ease,background-color .18s ease}
.af-btn:hover{color:var(--brand);border-color:var(--brand);transform:translateY(-2px)}
.af-btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--brand),var(--brand-2));
  color:#fff;border-color:transparent;box-shadow:0 8px 18px -10px var(--brand)}
.af-count{font-size:.7rem;font-weight:800;opacity:.7;margin-left:5px}

.awards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.award{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;overflow:hidden}
/* 左侧分类色条 */
.award::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));opacity:.75}
.award.cat-书法::before{background:linear-gradient(180deg,#f59e0b,#fbbf24)}
.award.cat-乐器::before{background:linear-gradient(180deg,#8b5cf6,#a78bfa)}
.award.cat-技能::before{background:linear-gradient(180deg,#0ea5e9,#38bdf8)}
.award.cat-文学::before{background:linear-gradient(180deg,#ec4899,#f472b6)}
.award.cat-学业::before{background:linear-gradient(180deg,#10b981,#34d399)}
.award.cat-干部::before{background:linear-gradient(180deg,#4f46e5,#818cf8)}
.award .cat{font-size:.7rem;font-weight:800;letter-spacing:.1em;color:var(--brand)}
.award .name{font-size:.94rem;font-weight:700;line-height:1.5}
.award .lvl{font-size:.78rem;color:var(--muted)}
.award-hint{position:absolute;top:15px;right:16px;font-size:.67rem;font-weight:600;color:var(--muted);opacity:.72;text-decoration:none;white-space:nowrap;transition:color .18s ease,opacity .18s ease}
.award-hint:hover{color:var(--brand);opacity:1;text-decoration:underline}
.award-hint::after{content:" ↗";font-size:.72em}
.award.has-img:hover{border-color:var(--brand)}
@media(max-width:640px){.award{padding:16px 15px 14px}.award-hint{top:13px;right:13px;font-size:.63rem}}

/* ============ Tabs ============ */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{padding:8px 17px;border-radius:999px;font-size:.85rem;font-weight:650;background:var(--card);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:transform .18s ease,color .18s ease,border-color .18s ease,background-color .18s ease,box-shadow .18s ease}
.tab:hover{color:var(--brand);border-color:var(--brand);transform:translateY(-2px)}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px rgba(79,70,229,.95)}
.tab-panel{outline:none}

/* ============ 经历 ============ */
.exp-note{font-size:.83rem;color:var(--muted);border-left:3px solid var(--brand);background:var(--brand-soft);padding:10px 16px;border-radius:0 12px 12px 0;margin-bottom:18px;line-height:1.7}
/* 经历列表：左侧连接轴，形成时间线感 */
#exp-panel{position:relative}
#exp-panel:not(:empty){padding-left:26px}
#exp-panel::before{content:"";position:absolute;left:7px;top:8px;bottom:16px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--brand),var(--brand-2),transparent);opacity:.4;pointer-events:none}
.exp-card{position:relative;padding:20px 22px;margin-bottom:14px;animation:fadeUp .35s ease}
.exp-card::before{content:"";position:absolute;left:-26px;top:26px;width:11px;height:11px;border-radius:50%;
  box-sizing:border-box;background:var(--card);border:3px solid var(--brand);
  box-shadow:0 0 0 4px var(--brand-soft)}
.exp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.exp-head h3{font-size:1.02rem;font-weight:750;margin-bottom:5px}
.exp-org{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.points{margin-top:14px;display:grid;gap:9px}
.points li{position:relative;padding-left:18px;font-size:.885rem;color:var(--muted);line-height:1.78}
.points li::before{content:"";position:absolute;left:2px;top:.66em;width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2))}
@media(max-width:640px){
  #exp-panel:not(:empty){padding-left:18px}
  #exp-panel::before{left:4px}
  .exp-card::before{left:-18px;width:9px;height:9px}
}

/* ============ 项目 ============ */
.proj-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.proj-card{position:relative;padding:22px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.proj-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;
  background:linear-gradient(90deg,var(--brand),var(--brand-2),var(--accent));opacity:.85}
/* 右下角大号序号水印 */
.proj-card .p-idx{position:absolute;right:14px;bottom:6px;font-size:3.4rem;font-weight:800;
  line-height:1;color:var(--brand);opacity:.07;pointer-events:none;font-variant-numeric:tabular-nums;
  transition:opacity .25s ease,transform .25s ease}
.proj-card:hover .p-idx{opacity:.13;transform:translateY(-3px)}
.proj-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.proj-top h3{font-size:1.05rem;font-weight:750}
.proj-stack{display:flex;flex-wrap:wrap;gap:6px}
.stack-tag{font-size:.72rem;font-weight:700;letter-spacing:.02em;padding:3px 10px;border-radius:8px;color:var(--brand);background:var(--brand-soft);border:1px solid var(--line);
  transition:transform .18s ease,background-color .18s ease,color .18s ease}
.stack-tag:hover{transform:translateY(-2px);background:var(--brand);color:#fff}

/* ============ 技能矩阵 ============ */
/* —— 顶部概览：四组能力一览，含环形 / 柱形两种图形 —— */
.skill-overview{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px}
@media(max-width:800px){.skill-overview{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:440px){.skill-overview{grid-template-columns:1fr}}
.ov-card{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--radius);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-sm);
  transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.ov-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--brand-soft)}
.ov-ring{width:52px;height:52px;flex:0 0 auto;position:relative;display:grid;place-items:center}
.ov-ring svg{transform:rotate(-90deg);display:block}
.ov-ring .track{fill:none;stroke:var(--brand-soft);stroke-width:5}
.ov-ring .prog{fill:none;stroke:url(#ovGrad);stroke-width:5;stroke-linecap:round;
  stroke-dasharray:var(--circ);stroke-dashoffset:var(--circ);
  transition:stroke-dashoffset 1.1s cubic-bezier(.22,.7,.25,1)}
.reveal.in .ov-ring .prog{stroke-dashoffset:calc(var(--circ) * (1 - var(--p) / 100))}
.ov-num{position:absolute;inset:0;display:grid;place-items:center;font-size:.74rem;font-weight:800;color:var(--brand)}
.ov-info{min-width:0}
.ov-info strong{display:block;font-size:.9rem;font-weight:750;line-height:1.35}
.ov-info small{display:block;font-size:.74rem;color:var(--muted);margin-top:3px;letter-spacing:.02em}

.skill-grid{display:grid;gap:20px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:800px){.skill-grid{grid-template-columns:1fr;gap:16px}}
.skill-card{padding:26px 28px}
@media(max-width:640px){.skill-card{padding:20px 20px}}
.skill-group{font-size:1rem;font-weight:750;margin-bottom:20px;display:flex;align-items:center;gap:10px;
  padding-bottom:14px;border-bottom:1px solid var(--line)}
.skill-group .ico-wrap{color:var(--brand)}
.skill-group .g-name{flex:1 1 auto;min-width:0}
.skill-group .g-tag{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);opacity:.7;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}

.skill-row{margin-bottom:18px}
.skill-row:last-child{margin-bottom:0}
.skill-name{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.88rem;font-weight:650}
.skill-val{font-size:.78rem;font-weight:700;color:var(--brand);flex:0 0 auto}

/* —— 变体 A：胶囊进度条 —— */
.sk-bar .skill-name{margin-bottom:9px}
.sk-bar .bar{height:9px;border-radius:999px;background:var(--brand-soft);overflow:hidden;position:relative}
.sk-bar .bar > i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--brand),var(--brand-2));
  transition:width .95s cubic-bezier(.22,.7,.25,1)}
.reveal.in .sk-bar .bar > i{width:var(--w)}
/* 刻度纹理，弱化“整条实心”的单调感 */
.sk-bar .bar::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(90deg,transparent 0 7px,var(--card) 7px 8px);opacity:.5}

/* —— 变体 B：十段细点，等差可辨 —— */
.sk-dots .skill-name{margin-bottom:9px;align-items:center}
.sk-dots .dots{display:flex;align-items:center;gap:4px}
.sk-dots .dots i{height:8px;border-radius:999px;background:var(--brand-soft);
  position:relative;overflow:hidden;flex:1 1 0;transition:background-color .3s ease}
.sk-dots .dots i::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;
  border-radius:50%;background:var(--brand);opacity:.25;transform:translate(-50%,-50%);transition:opacity .3s ease}
.sk-dots .dots i.on{background:linear-gradient(90deg,var(--brand),var(--brand-2))}
.sk-dots .dots i.on::after{opacity:0}
.sk-dots .dots i:nth-child(1){transition-delay:.03s}
.sk-dots .dots i:nth-child(2){transition-delay:.05s}
.sk-dots .dots i:nth-child(3){transition-delay:.07s}
.sk-dots .dots i:nth-child(4){transition-delay:.09s}
.sk-dots .dots i:nth-child(5){transition-delay:.11s}
.sk-dots .dots i:nth-child(6){transition-delay:.13s}
.sk-dots .dots i:nth-child(7){transition-delay:.15s}
.sk-dots .dots i:nth-child(8){transition-delay:.17s}
.sk-dots .dots i:nth-child(9){transition-delay:.19s}
.sk-dots .dots i:nth-child(10){transition-delay:.21s}

/* —— 变体 C：分段方块 —— */
.sk-seg .skill-name{margin-bottom:9px}
.sk-seg .segs{display:flex;gap:4px}
.sk-seg .segs i{flex:1 1 0;height:12px;border-radius:3px;background:var(--brand-soft);
  transition:background-color .32s ease,transform .32s ease,box-shadow .32s ease}
.sk-seg .segs i.on{background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 2px 6px -2px var(--brand)}
.sk-seg .segs i:nth-child(1){transition-delay:.03s}
.sk-seg .segs i:nth-child(2){transition-delay:.06s}
.sk-seg .segs i:nth-child(3){transition-delay:.09s}
.sk-seg .segs i:nth-child(4){transition-delay:.12s}
.sk-seg .segs i:nth-child(5){transition-delay:.15s}
.sk-seg .segs i:nth-child(6){transition-delay:.18s}
.sk-seg .segs i:nth-child(7){transition-delay:.21s}
.sk-seg .segs i:nth-child(8){transition-delay:.24s}
.sk-seg .segs i:nth-child(9){transition-delay:.27s}
.sk-seg .segs i:nth-child(10){transition-delay:.30s}
.sk-seg .skill-val{font-variant-numeric:tabular-nums}

/* —— 变体 D：环形（艺术素养） —— */
.sk-ring .skill-rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.sk-ring .ring-item{display:flex;flex-direction:column;align-items:center;gap:6px}
.sk-ring .ring-wrap{width:72px;height:72px;position:relative;display:grid;place-items:center}
.sk-ring .ring-wrap svg{transform:rotate(-90deg);display:block}
.sk-ring .ring-track{fill:none;stroke:var(--brand-soft);stroke-width:6}
.sk-ring .ring-prog{fill:none;stroke:url(#ovGrad);stroke-width:6;stroke-linecap:round;
  stroke-dasharray:var(--circ);stroke-dashoffset:var(--circ);
  transition:stroke-dashoffset 1.15s cubic-bezier(.22,.7,.25,1)}
.reveal.in .sk-ring .ring-prog{stroke-dashoffset:calc(var(--circ) * (1 - var(--p) / 100))}
.sk-ring .ring-num{position:absolute;inset:0;display:grid;place-items:center;
  font-size:.78rem;font-weight:800;color:var(--brand)}
.sk-ring .ring-label{font-size:.72rem;line-height:1.45;color:var(--muted);font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:400px){.sk-ring .skill-rings{gap:6px}.sk-ring .ring-wrap{width:62px;height:62px}}

/* ============ 教育 ============ */
.timeline{position:relative;padding-left:30px}
.timeline::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--brand),var(--brand-2),transparent)}
.tl-item{position:relative;margin-bottom:16px}
.tl-item:last-child{margin-bottom:0}
/* 时间轴节点加光晕环 */
.tl-item::before{content:"";position:absolute;left:-27px;top:24px;width:12px;height:12px;border-radius:50%;box-sizing:border-box;background:var(--card);border:3px solid var(--brand);
  box-shadow:0 0 0 4px var(--brand-soft);transition:box-shadow .25s ease}
.tl-item:hover::before{box-shadow:0 0 0 7px var(--brand-soft)}
.tl-item .edu-card{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.tl-item:hover .edu-card{transform:translateX(3px);border-color:var(--brand)}

/* ============ 自我评价 ============ */
.eval-list{display:grid;gap:14px}
.eval-list li{position:relative;padding:16px 18px 16px 46px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);font-size:.9rem;color:var(--muted);line-height:1.8;
  box-shadow:var(--shadow-sm);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.eval-list li:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand)}
/* 序号徽章替代原小方块 */
.eval-list li::before{content:counter(evalItem,decimal-leading-zero);counter-increment:evalItem;
  position:absolute;left:14px;top:15px;width:22px;height:22px;border-radius:7px;
  display:grid;place-items:center;font-size:.66rem;font-weight:800;letter-spacing:0;
  color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 3px 8px -4px var(--brand)}
.eval-list{counter-reset:evalItem}
.edu-card{padding:20px 22px}

/* ============ 页脚 ============ */
.footer{margin-top:56px;padding:30px 0 46px;border-top:1px solid var(--line);text-align:center;font-size:.8rem;color:var(--muted)}
.footer .foot-line{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.footer .dot-sep{opacity:.45}

    var cx=Math.cos(o.tiltX),sx=Math.sin(o.tiltX);
    var y1=y*cx-z*sx, z1=y*sx+z*cx;
    var cz=Math.cos(o.tiltZ),sz=Math.sin(o.tiltZ);
    var x1=x*cz-y1*sz, y2=x*sz+y1*cz;
    return {x:x1,y:y2,z:z1};
  }

  function buildStars(){
    stars.length=0;
    var count=Math.round(Math.min(520,Math.max(240,(W*H)/4200)));
    for(var i=0;i<count;i++){
      var r=420+Math.random()*980, th=Math.random()*TAU, ph=Math.acos(2*Math.random()-1), sp=Math.sin(ph);
      stars.push({
        x:r*sp*Math.cos(th), y:r*Math.cos(ph)*0.82, z:r*sp*Math.sin(th),
        r:0.4+Math.random()*1.6, a:0.22+Math.random()*0.62,
        tw:0.5+Math.random()*1.9, off:Math.random()*TAU
      });
    }
  }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.max(1,Math.round(W*DPR));
    canvas.height=Math.max(1,Math.round(H*DPR));
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    bgGrad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.62);
    bgGrad.addColorStop(0,'rgba(99,102,241,0.16)');
    bgGrad.addColorStop(0.42,'rgba(56,189,248,0.05)');
    bgGrad.addColorStop(1,'rgba(0,0,0,0)');
    buildStars();
  }

  /* ============================================================
     流星（深色模式）
     全部原生 Canvas 实现，不引入任何外部库。
     两个系统只叠加绘制，不改动 stars / orbits / 拖拽 / 缩放逻辑。
     ============================================================ */

  /* —— 主题判定：跟随 <html data-theme="dark"> —— */
  function isDark(){
    return document.documentElement.getAttribute('data-theme')==='dark';
  }

  /* ===================== 流星系统 ===================== */
  var meteors=[];
  var meteorNextAt=0;          /* 下一次生成的时间戳(ms) */
  var METEOR_MIN_GAP=2000;     /* 间隔下限 2s */
  var METEOR_MAX_GAP=8000;     /* 间隔上限 8s */

  function scheduleMeteor(now){
    meteorNextAt=now+METEOR_MIN_GAP+Math.random()*(METEOR_MAX_GAP-METEOR_MIN_GAP);
  }

  /* 生成一颗流星：从屏幕上边缘或两侧斜向飞入 */
  function spawnMeteor(){
    /* 斜向飞行：统一让速度方向朝「左下→右上」的镜像随机构成，
       即 x 与 y 分量始终异号，保证是斜线而非垂直下落 */
    var speed=0.55+Math.random()*1.15;          /* 快慢有差异 */
    var ang=(22+Math.random()*26)*Math.PI/180;  /* 与水平夹角 22°~48° */
    var dir=Math.random()<0.5?1:-1;             /* 向右下 / 向左下 */

    /* 起点：多数从上方飞入，少数从左右两侧飞入 */
    var from='top';
    var r=Math.random();
    if(r<0.62) from='top';
    else if(r<0.81) from='left';
    else from='right';

    var x,y;
    if(from==='top'){
      x=Math.random()*(W*1.1)-W*0.05;
      y=-40-Math.random()*80;
    }else if(from==='left'){
      x=-60-Math.random()*80;
      y=Math.random()*H*0.55;
    }else{
      x=W+60+Math.random()*80;
      y=Math.random()*H*0.55;
    }

    /* 方向向量：斜向（x 与 y 都非零，且异号 => 斜线） */
    var vx=Math.cos(ang)*speed*dir;
    var vy=Math.sin(ang)*speed;   /* 始终向下 */
    /* 从左右侧飞入时，x 方向朝屏幕内部修正 */
    if(from==='left'&&vx<0) vx=-vx;
    if(from==='right'&&vx>0) vx=-vx;

    meteors.push({
      x:x, y:y,
      vx:vx, vy:vy,
      len:110+Math.random()*190,        /* 拖尾长度 */
      w:1.1+Math.random()*1.5,          /* 头部粗细 */
      hue:Math.random()<0.72?'255,255,255':'186,230,255',
      life:0, maxLife:2600+Math.random()*1800
    });
  }

  /* 更新并绘制流星；飞出边界即销毁 */
  function drawMeteors(dt){
    for(var i=meteors.length-1;i>=0;i--){
      var m=meteors[i];
      m.x+=m.vx*dt; m.y+=m.vy*dt; m.life+=dt*16.7;

      /* 边界检测：完全飞出画布（含拖尾余量）则销毁 */
      var margin=m.len+80;
      if(m.x<-margin||m.x>W+margin||m.y<-margin||m.y>H+margin||m.life>m.maxLife){
        meteors.splice(i,1);
        continue;
      }

      var sp=Math.hypot(m.vx,m.vy)||1;
      var ux=m.vx/sp, uy=m.vy/sp;
      var tx=m.x-ux*m.len, ty=m.y-uy*m.len;   /* 拖尾末端 */

      /* 渐变拖尾：头部亮、尾部淡出 */
      var g=ctx.createLinearGradient(m.x,m.y,tx,ty);
      g.addColorStop(0,'rgba('+m.hue+',0.95)');
      g.addColorStop(0.18,'rgba('+m.hue+',0.55)');
      g.addColorStop(0.55,'rgba('+m.hue+',0.16)');
      g.addColorStop(1,'rgba('+m.hue+',0)');
      ctx.strokeStyle=g;
      ctx.lineWidth=m.w;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(m.x,m.y);
      ctx.lineTo(tx,ty);
      ctx.stroke();

      /* 头部光晕 */
      var hr=m.w*4.2;
      var hg=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,hr);
      hg.addColorStop(0,'rgba(255,255,255,0.95)');
      hg.addColorStop(0.35,'rgba('+m.hue+',0.5)');
      hg.addColorStop(1,'rgba('+m.hue+',0)');
      ctx.fillStyle=hg;
      ctx.beginPath(); ctx.arc(m.x,m.y,hr,0,TAU); ctx.fill();

      /* 头部亮点 */
      ctx.fillStyle='rgba(255,255,255,0.98)';
      ctx.beginPath(); ctx.arc(m.x,m.y,Math.max(0.9,m.w*0.85),0,TAU); ctx.fill();
    }
  }

  function draw(now){
    var t=now*0.001;
    /* 帧间隔（毫秒→以 60fps 为 1 的倍率），限制上限防止切后台后跳变 */
    var dt=lastNow?Math.min((now-lastNow)/16.7,3):1;
    if(!dragging){
      rotY+=velY; rotX+=velX;
      velY*=0.95; velX*=0.95;
      if(Math.abs(velY)<2e-5) velY=0;
      if(Math.abs(velX)<2e-5) velX=0;
      rotY+=0.00035;
      if(rotX>1.15) rotX=1.15;
      if(rotX<-1.15) rotX=-1.15;
    }
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    if(bgGrad){ ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H); }

    /* —— 模式切换：深色出流星 —— */
    var dark=isDark();

    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<stars.length;i++){
      var st=stars[i];
      var p=project(st);
      if(!p) continue;
      if(p.x<-50||p.x>W+50||p.y<-50||p.y>H+50) continue;
      var tw=0.55+0.45*Math.sin(t*st.tw+st.off);
      var rad=Math.max(0.4,Math.min(st.r*p.s,2.6));
      var al=Math.min(1,st.a*tw*(0.55+p.s*0.45));
      ctx.beginPath();
      ctx.arc(p.x,p.y,rad,0,TAU);
      ctx.fillStyle='rgba(214,225,255,'+al.toFixed(3)+')';
      ctx.fill();
    }

    ctx.globalCompositeOperation='source-over';
    for(var oi=0;oi<orbits.length;oi++){
      var o=orbits[oi], SEG=72, pen=false;
      ctx.beginPath();
      for(var k=0;k<=SEG;k++){
        var a=(k/SEG)*TAU;
        var op=project(orbitPoint(o,a));
        if(!op){ pen=false; continue; }
        if(pen) ctx.lineTo(op.x,op.y);
        else { ctx.moveTo(op.x,op.y); pen=true; }
      }
      ctx.strokeStyle=hexA(o.color,0.13);
      ctx.lineWidth=1;
      ctx.stroke();
    }

    ctx.globalCompositeOperation='lighter';
    for(var oj=0;oj<orbits.length;oj++){
      var ob=orbits[oj];
      for(var bi=0;bi<ob.bodies.length;bi++){
        var b=ob.bodies[bi];
        var head=t*ob.speed*ob.dir+b.phase;
        var TRAIL=18;
        for(var m=TRAIL;m>=1;m--){
          var ta=head-m*0.016*ob.dir;
          var tp=project(orbitPoint(ob,ta));
          if(!tp) continue;
          var f=1-m/TRAIL;
          var tRad=Math.max(0.5,(0.8+3.2*f)*Math.min(tp.s,1.6));
          ctx.beginPath();
          ctx.arc(tp.x,tp.y,tRad,0,TAU);
          ctx.fillStyle=hexA(ob.color,0.05+0.42*f*f);
          ctx.fill();
        }
        var hp=project(orbitPoint(ob,head));
        if(hp){
          var R=Math.max(9,20*Math.min(hp.s,1.6));
          var g=ctx.createRadialGradient(hp.x,hp.y,0,hp.x,hp.y,R);
          g.addColorStop(0,'rgba(255,255,255,0.95)');
          g.addColorStop(0.18,hexA(ob.color,0.85));
          g.addColorStop(0.55,hexA(ob.color,0.22));
          g.addColorStop(1,hexA(ob.color,0));
          ctx.fillStyle=g;
          ctx.beginPath(); ctx.arc(hp.x,hp.y,R,0,TAU); ctx.fill();
          ctx.beginPath();
          ctx.arc(hp.x,hp.y,Math.max(1.2,2.4*Math.min(hp.s,1.6)),0,TAU);
          ctx.fillStyle='rgba(255,255,255,0.95)';
          ctx.fill();
        }
      }
    }

    /* —— 流星（仅深色模式）：随机 2~8s 间隔 —— */
    if(dark){
      if(now>=meteorNextAt){
        spawnMeteor();
        scheduleMeteor(now);
      }
      ctx.globalCompositeOperation='lighter';
      drawMeteors(dt);
    } else if(meteors.length){
      meteors.length=0;   /* 切到浅色时清空，避免残留 */
    }

    ctx.globalCompositeOperation='source-over';
    lastNow=now;
  }

  function loop(now){
    if(!running) return;
    draw(now);
    rafId=window.requestAnimationFrame(loop);
  }

  function onDown(e){
    dragging=true; lastX=e.clientX; lastY=e.clientY; velX=0; velY=0;
    if(canvas.setPointerCapture&&e.pointerId!==undefined){
      try{canvas.setPointerCapture(e.pointerId);}catch(err){}
    }
  }
  function onMove(e){
    if(!dragging) return;
    var dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    rotY+=dx*0.0052; rotX+=dy*0.0036;
    if(rotX>1.15) rotX=1.15;
    if(rotX<-1.15) rotX=-1.15;
    velY=dx*0.0009; velX=dy*0.0006;
  }
  function onUp(){ dragging=false; }

  canvas.addEventListener('pointerdown',onDown);
  canvas.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);

  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    zoom*=Math.exp(-e.deltaY*0.0012);
    if(zoom>2.6) zoom=2.6;
    if(zoom<0.42) zoom=0.42;
  },{passive:false});

  var pinchDist=0;
  canvas.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      pinchDist=Math.hypot(dx,dy);
    }
  },{passive:true});
  canvas.addEventListener('touchmove',function(e){
    if(e.touches.length===2){
      e.preventDefault();
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      var d=Math.hypot(dx,dy);
      if(pinchDist>0){
        zoom*=d/pinchDist;
        if(zoom>2.6) zoom=2.6;
        if(zoom<0.42) zoom=0.42;
      }
      pinchDist=d;
    }
  },{passive:false});
  canvas.addEventListener('touchend',function(){ pinchDist=0; },{passive:true});

  var resizeTimer=null;
  window.addEventListener('resize',function(){
    if(resizeTimer) clearTimeout(resizeTimer);
    resizeTimer=setTimeout(resize,120);
  });

  var started=false;
  function enterSite(){
    if(started) return;
    started=true;
    introEl.classList.add('hidden');
    document.body.classList.remove('locked');
    try{ sessionStorage.setItem('wyc-intro-seen','1'); }catch(e){}
    window.scrollTo(0,0);
    setTimeout(function(){
      running=false;
      if(rafId){ window.cancelAnimationFrame(rafId); rafId=null; }
      introEl.style.display='none';
    },950);
  }
  startBtn.addEventListener('click',enterSite);
  startBtn.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); enterSite(); }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') enterSite();
  });

  document.addEventListener('visibilitychange',function(){
    if(document.hidden){
      running=false;
      if(rafId){ window.cancelAnimationFrame(rafId); rafId=null; }
    } else if(!started){
      running=true;
      rafId=window.requestAnimationFrame(loop);
    }
  });

  resize();
  rafId=window.requestAnimationFrame(loop);
})();

/* ============================================================
   正文页背景氛围层（原生 Canvas）
   · 浅色模式：柔光浮尘（缓慢上浮的微粒 + 漂移光斑）
   · 深色模式：微光流星（低频率、很淡，不干扰阅读）
   · 纯装饰：pointer-events:none，不遮挡任何交互
   · 性能：页面隐藏 / 滚动到不可见时自动暂停，DPR 上限 2
   ============================================================ */
(function(){
  'use strict';
  var canvas=document.getElementById('pageCanvas');
  if(!canvas) return;
  var ctx=canvas.getContext('2d');
  var TAU=Math.PI*2;

  var W=0,H=0,DPR=1;
  var rafId=null,running=false,lastNow=0;
  var dust=[],blobs=[],shoots=[];
  var shootNextAt=0;
  var SHOOT_MIN=3200, SHOOT_MAX=8500;   /* 正文页比开场页克制，但比初版更易被看到 */
  function isDark(){
    return document.documentElement.getAttribute('data-theme')==='dark';
  }
  function rand(a,b){ return a+Math.random()*(b-a); }

  /* —— 浮尘（浅色） —— */
  function buildDust(){
    dust.length=0;
    var n=Math.round(Math.min(78,Math.max(30,W/20)));
    for(var i=0;i<n;i++){
      dust.push({
        x:Math.random()*W,
        y:Math.random()*H,
        r:rand(0.9,3.0),
        vy:-rand(0.09,0.32),          /* 缓慢上浮 */
        vx:rand(-0.14,0.14),
        a:rand(0.18,0.52),
        tw:rand(0.3,1.1),
        off:Math.random()*TAU
      });
    }
  }

  /* —— 漂移光斑（浅色） —— */
  function buildBlobs(){
    blobs.length=0;
    var n=4;
    for(var i=0;i<n;i++){
      blobs.push({
        x:rand(0.1,0.9)*W,
        y:rand(0.1,0.9)*H,
        r:rand(150,300),
        vx:rand(-0.065,0.065),
        vy:rand(-0.05,0.05),
        a:rand(0.055,0.115),
        off:Math.random()*TAU,
        sp:rand(0.10,0.24)
      });
    }
  }

  /* —— 背景流星（深色）：比开场页更淡更慢 —— */
  function spawnShoot(){
    var speed=0.38+Math.random()*0.78;
    var ang=rand(20,46)*Math.PI/180;
    var dir=Math.random()<0.5?1:-1;
    var r=Math.random();
    var x,y;
    if(r<0.6){ x=Math.random()*(W*1.15)-W*0.075; y=-30-Math.random()*60; }
    else if(r<0.8){ x=-40-Math.random()*60; y=Math.random()*H*0.4; }
    else { x=W+40+Math.random()*60; y=Math.random()*H*0.4; }

    var vx=Math.cos(ang)*speed*dir;
    var vy=Math.sin(ang)*speed;
    if(x<0&&vx<0) vx=-vx;
    if(x>W&&vx>0) vx=-vx;

    shoots.push({
      x:x,y:y,vx:vx,vy:vy,
      len:rand(95,200),
      w:rand(1.0,1.9),
      life:0,maxLife:rand(2400,3800)
    });
  }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.max(1,Math.round(W*DPR));
    canvas.height=Math.max(1,Math.round(H*DPR));
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildDust(); buildBlobs();
  }

  function drawBlobs(t){
    for(var i=0;i<blobs.length;i++){
      var b=blobs[i];
      b.x+=b.vx; b.y+=b.vy;
      /* 环绕边界，避免长期跑出画面 */
      if(b.x<-b.r) b.x=W+b.r; if(b.x>W+b.r) b.x=-b.r;
      if(b.y<-b.r) b.y=H+b.r; if(b.y>H+b.r) b.y=-b.r;
      var breath=0.72+0.28*Math.sin(t*b.sp+b.off);
      var g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      g.addColorStop(0,'rgba(79,70,229,'+(b.a*breath).toFixed(4)+')');
      g.addColorStop(0.45,'rgba(14,165,233,'+(b.a*breath*0.55).toFixed(4)+')');
      g.addColorStop(1,'rgba(14,165,233,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
    }
  }

  function drawDust(t,dt){
    for(var i=0;i<dust.length;i++){
      var d=dust[i];
      d.y+=d.vy*dt; d.x+=d.vx*dt;
      if(d.y<-12){ d.y=H+12; d.x=Math.random()*W; }
      if(d.x<-12) d.x=W+12; if(d.x>W+12) d.x=-12;
      var tw=0.6+0.4*Math.sin(t*d.tw+d.off);
      var a=d.a*tw;
      /* 柔和光点：径向渐变而非实心圆，更像浮尘 */
      var g=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r*3.4);
      g.addColorStop(0,'rgba(255,255,255,'+a.toFixed(3)+')');
      g.addColorStop(0.42,'rgba(210,224,255,'+(a*0.42).toFixed(3)+')');
      g.addColorStop(1,'rgba(200,216,255,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r*3.4,0,TAU); ctx.fill();
    }
  }

  function drawShoots(dt){
    for(var i=shoots.length-1;i>=0;i--){
      var m=shoots[i];
      m.x+=m.vx*dt; m.y+=m.vy*dt; m.life+=dt*16.7;
      var margin=m.len+60;
      if(m.x<-margin||m.x>W+margin||m.y<-margin||m.y>H+margin||m.life>m.maxLife){
        shoots.splice(i,1); continue;
      }
      var sp=Math.hypot(m.vx,m.vy)||1;
      var ux=m.vx/sp, uy=m.vy/sp;
      var tx=m.x-ux*m.len, ty=m.y-uy*m.len;
      var g=ctx.createLinearGradient(m.x,m.y,tx,ty);
      g.addColorStop(0,'rgba(214,232,255,0.78)');
      g.addColorStop(0.18,'rgba(192,218,255,0.42)');
      g.addColorStop(0.55,'rgba(172,204,255,0.13)');
      g.addColorStop(1,'rgba(170,200,255,0)');
      ctx.strokeStyle=g; ctx.lineWidth=m.w; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(m.x,m.y); ctx.lineTo(tx,ty); ctx.stroke();

      ctx.fillStyle='rgba(240,248,255,0.92)';
      ctx.beginPath(); ctx.arc(m.x,m.y,Math.max(1.0,m.w*0.9),0,TAU); ctx.fill();
    }
  }

  function draw(now){
    var t=now*0.001;
    var dt=lastNow?Math.min((now-lastNow)/16.7,3):1;
    var dark=isDark();

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);

    if(dark){
      /* 深色：只画很淡的流星 */
      if(now>=shootNextAt){ spawnShoot(); shootNextAt=now+rand(SHOOT_MIN,SHOOT_MAX); }
      ctx.globalCompositeOperation='lighter';
      drawShoots(dt);
      dust.length=0;
    }else{
      /* 浅色：柔光斑 + 上浮微粒 */
      ctx.globalCompositeOperation='lighter';
      drawBlobs(t);
      drawDust(t,dt);
      shoots.length=0;
    }
    ctx.globalCompositeOperation='source-over';
    lastNow=now;
  }

  function loop(now){
    if(!running) return;
    draw(now);
    rafId=window.requestAnimationFrame(loop);
  }

  /* 数字滚动：进入视口后从 0 累加到目标值 */
  function animateCounters(){
    var nums=document.querySelectorAll('#statsGrid .stat .num-v');
    if(!nums.length) return;
    var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce||!('IntersectionObserver' in window)) return;
    var io=new IntersectionObserver(function(entries,obs){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        var el=en.target;
        obs.unobserve(el);
        var target=parseFloat(String(el.textContent).replace(/[^\d.]/g,''));
        if(isNaN(target)) return;
        var dec=(String(el.textContent).split('.')[1]||'').length;
        var t0=null, dur=1100;
        function step(ts){
          if(!t0) t0=ts;
          var p=Math.min((ts-t0)/dur,1);
          var e=1-Math.pow(1-p,3);
          el.textContent=(target*e).toFixed(dec);
          if(p<1) requestAnimationFrame(step);
          else el.textContent=target.toFixed(dec);
        }
        requestAnimationFrame(step);
      });
    },{threshold:.4});
    nums.forEach(function(n){ io.observe(n); });
  }

  /* —— 技能矩阵：4 组用 4 种不同图形，避免单一进度条 —— */
  /* 环形通用参数：r=20 时周长约 125.66 */
  var RING_R=20, OV_R=22;

  /* 生成一个环形 SVG：pct 为百分比，r 为半径 */
  function ringSvg(pct,r,trackCls,progCls){
    var R=r||OV_R, C=(2*Math.PI*R).toFixed(2);
    var box=(R+6)*2;                     /* 留出描边宽度，居中不裁切 */
    var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 '+box+' '+box);
    s.setAttribute('aria-hidden','true');
    var cx=box/2;
    var t=document.createElementNS('http://www.w3.org/2000/svg','circle');
    t.setAttribute('cx',String(cx));t.setAttribute('cy',String(cx));t.setAttribute('r',String(R));
    t.setAttribute('class',trackCls);
    var p=document.createElementNS('http://www.w3.org/2000/svg','circle');
    p.setAttribute('cx',String(cx));p.setAttribute('cy',String(cx));p.setAttribute('r',String(R));
    p.setAttribute('class',progCls);
    p.style.setProperty('--circ',C);
    p.style.setProperty('--p',String(pct));
    s.appendChild(t);s.appendChild(p);
    return s;
  }

  /* —— 两侧边缘装饰（宽屏可见） —— */
  function renderEdgeDecor(){
    if(window.matchMedia&&!window.matchMedia('(min-width:1440px)').matches) return;
    var layer=document.createElement('div');
    layer.className='edge';
    layer.setAttribute('aria-hidden','true');

    function push(el){ layer.appendChild(el); }
    function div(cls,html){ var d=document.createElement('div'); d.className=cls; if(html) d.innerHTML=html; return d; }

    /* 1. 柔和光斑 */
    push(div('e-orb o1')); push(div('e-orb o2')); push(div('e-orb o3'));

    /* 2. 刻度尺：每 6vh 一格，每 4 格一个主刻度 */
    ['l','r'].forEach(function(side){
      var ruler=document.createElement('div');
      ruler.className='e-ruler '+side;
      for(var i=0;i<=17;i++){
        var s=document.createElement('span');
        var isMajor=(i%4===0);
        s.className=isMajor?'tick major':(i%2===0?'tick':'tick minor');
        s.style.top=(i*6)+'%';
        if(side==='l') s.style.left='0'; else s.style.right='0';
        ruler.appendChild(s);
      }
      push(ruler);
    });

    /* 3. 竖排标签 */
    push(div('e-tag l t1','<span class="dot"></span>GIS'));
    push(div('e-tag l t2','DIGITAL MEDIA'));
    push(div('e-tag r t1','DATA ANALYSIS'));
    push(div('e-tag r t2','<span class="dot"></span>2026'));

    /* 4. 几何描边图形 */
    var NS='http://www.w3.org/2000/svg';
    function shape(cls,vb,inner){
      var w=document.createElementNS(NS,'svg');
      w.setAttribute('viewBox',vb);
      w.setAttribute('class','e-shape '+cls);
      w.setAttribute('fill','none');
      w.innerHTML=inner;
      return w;
    }
    /* 同心圆 + 十字准星 */
    push(shape('e-sh1','0 0 120 120',
      '<circle cx="60" cy="60" r="52"/><circle cx="60" cy="60" r="34" class="dim"/>'+
      '<circle cx="60" cy="60" r="16"/><line x1="60" y1="0" x2="60" y2="24" class="dim"/>'+
      '<line x1="60" y1="96" x2="60" y2="120" class="dim"/><line x1="0" y1="60" x2="24" y2="60" class="dim"/>'+
      '<line x1="96" y1="60" x2="120" y2="60" class="dim"/>'+
      '<path d="M60 44l16 16-16 16-16-16z" class="dim"/>'));
    /* 网格方框 + 对角虚线 */
    push(shape('e-sh2','0 0 150 150',
      '<rect x="15" y="15" width="120" height="120" rx="10"/>'+
      '<rect x="40" y="40" width="70" height="70" rx="6" class="dim"/>'+
      '<line x1="15" y1="15" x2="135" y2="135" class="dim"/>'+
      '<line x1="135" y1="15" x2="15" y2="135" class="dim"/>'+
      '<circle cx="75" cy="75" r="8"/>'));
    /* 定位点 */
    push(shape('e-sh3','0 0 80 80',
      '<path d="M40 6a24 24 0 0 1 24 24c0 18-24 44-24 44S16 48 16 30A24 24 0 0 1 40 6z"/>'+
      '<circle cx="40" cy="30" r="9" class="dim"/>'));
    /* 折线数据图 */
    push(shape('e-sh4','0 0 96 96',
      '<line x1="8" y1="88" x2="88" y2="88" class="dim"/>'+
      '<line x1="8" y1="8" x2="8" y2="88" class="dim"/>'+
