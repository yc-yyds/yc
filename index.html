<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif;
  --brand:#4f46e5;--brand-2:#0ea5e9;--brand-soft:rgba(79,70,229,.10);--accent:#f59e0b;
  --bg:#eef2fa;--card:rgba(255,255,255,.72);--text:#151a2d;--muted:#5b6478;--line:rgba(21,26,45,.09);
  --nav-bg:rgba(255,255,255,.62);--glow1:rgba(79,70,229,.12);--glow2:rgba(14,165,233,.11);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);--shadow:0 10px 30px -14px rgba(16,24,40,.25);
  --shadow-lg:0 24px 50px -24px rgba(16,24,40,.35);--radius:18px;
  /* 背景装饰：网格线 / 极光光晕 / 渐隐遮罩 */
  --grid-line:rgba(21,26,45,.04);--grid-size:56px;
  --aur1:rgba(125,140,255,.30);--aur2:rgba(80,180,255,.24);--aur3:rgba(255,190,120,.14);
  --fade:rgba(238,242,250,0);
  /* 正文区遮罩：压暗/提亮 Canvas 装饰层，保证正文文字对比度
     白天用浅色半透明白纱（提亮背景、压低彩色装饰饱和度） */
  --scrim:rgba(255,255,255,.30);
  --scrim-strong:rgba(255,255,255,.52);
  /* iOS 玻璃质感（白天）：毛玻璃 / 半透明层次 / 外轮廓 + 内高光双层描边 */
  --glass-edge:rgba(21,26,45,.16);--glass-stroke:rgba(255,255,255,.95);--glass-hi:rgba(255,255,255,.78);
  /* ===== 统一动效令牌：全站时长与缓动只在此处调参 =====
     时长三档：fast 即时反馈 / base 常规过渡 / slow 滚动入场
     缓动三类：ease 标准 / out 出场更顺 / spring 轻微回弹（克制） */
  --dur-fast:.18s;--dur:.34s;--dur-slow:.62s;
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-out:cubic-bezier(.22,.7,.25,1);
  --ease-spring:cubic-bezier(.34,1.28,.64,1);
  /* 垂直节奏：流式间距，移动端自动收紧，避免小屏留白过大 */
  --gap-sec:clamp(38px,6vw,64px);
  --gap-block:clamp(16px,2.4vw,24px);
}
html[data-theme="dark"]{
  --brand:#818cf8;--brand-2:#38bdf8;--brand-soft:rgba(129,140,248,.14);
  --bg:#05070f;--card:rgba(13,18,32,.72);--text:#e9ecf7;--muted:#98a2bd;--line:rgba(255,255,255,.10);
  --nav-bg:rgba(7,10,20,.68);--glow1:rgba(255,43,214,.20);--glow2:rgba(34,230,255,.16);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);--shadow:0 12px 34px -18px rgba(0,0,0,.9);
  --shadow-lg:0 28px 60px -28px rgba(0,0,0,.95);
  --grid-line:rgba(34,230,255,.10);
  --aur1:rgba(255,43,214,.32);--aur2:rgba(34,230,255,.26);--aur3:rgba(168,85,247,.20);
  --fade:rgba(5,7,15,0);
  /* 夜间遮罩：深色纱层压低霓虹饱和度，避免高亮装饰吃掉正文可读性 */
  --scrim:rgba(5,7,15,.34);
  --scrim-strong:rgba(5,7,15,.58);
  /* 赛博朋克机甲质感（夜间）：金属冷光 / 霓虹高饱和 / 玻璃泛光描边 */
  --glass-edge:rgba(120,180,255,.42);--glass-stroke:rgba(150,205,255,.50);--glass-hi:rgba(170,220,255,.42);
}
/* 主题切换平滑过渡：切换瞬间为所有元素短暂应用「变量渐变」动画，
   背景色 / 文字颜色 / 边框 / 阴影 / SVG 填充描边等随主题变量平滑过渡；
   过渡结束后立即移除该类，日常运行零额外开销，不影响页面性能 */
html.theme-anim,
html.theme-anim *,
html.theme-anim *::before,
html.theme-anim *::after{
  transition:background-color .6s cubic-bezier(.4,0,.2,1),
             color .6s cubic-bezier(.4,0,.2,1),
             border-color .6s cubic-bezier(.4,0,.2,1),
             box-shadow .6s cubic-bezier(.4,0,.2,1),
             fill .6s cubic-bezier(.4,0,.2,1),
             stroke .6s cubic-bezier(.4,0,.2,1),
             text-shadow .6s cubic-bezier(.4,0,.2,1) !important;
}
@media (prefers-reduced-motion: reduce){
  html.theme-anim,
  html.theme-anim *,
  html.theme-anim *::before,
  html.theme-anim *::after{ transition:none !important; }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px;-webkit-text-size-adjust:100%;
  background-color:transparent;overflow-x:hidden}
body{margin:0;font-family:var(--font);font-size:15.5px;line-height:1.75;color:var(--text);
  background-color:transparent;overflow-x:hidden;
  /* 原有极光+网格背景作为 WebGL 加载失败时的兜底（木琴加载后仍保留在底层作为补充氛围） */
  background-image:
    /* 1. 极光光晕：左上主色 · 右上青色 · 中下暖色点缀 */
    radial-gradient(1000px 620px at 6% -10%,var(--aur1),transparent 58%),
    radial-gradient(860px 520px at 98% -4%,var(--aur2),transparent 56%),
    radial-gradient(760px 500px at 78% 44%,var(--aur3),transparent 60%),
    /* 2. 网格织纹：格线 + 交点微亮，增加质感但不抢视 */
    linear-gradient(var(--grid-line) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-line) 1px,transparent 1px),
    radial-gradient(circle at 50% 50%,var(--grid-line) 0 1.2px,transparent 1.2px);
  background-size:auto,auto,auto,var(--grid-size) var(--grid-size),var(--grid-size) var(--grid-size),var(--grid-size) var(--grid-size);
  background-attachment:fixed,fixed,fixed,scroll,scroll,scroll;
  background-repeat:no-repeat,no-repeat,no-repeat,repeat,repeat,repeat;
  -webkit-font-smoothing:antialiased;
  transition:background-color .6s ease,color .6s ease;
  /* 移动端触摸滚动顺滑 */
  -webkit-overflow-scrolling:touch;touch-action:pan-y}

/* 网格层向下渐隐：保证正文区域足够干净，注意力集中在重点内容上 */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,var(--fade) 0%,var(--fade) 52%,var(--bg) 100%)}

/* 正文页背景氛围层：固定铺满视口，位于内容之下、body 背景之上
   WebGL 木琴模式下：木琴画布在最底层（z-index: -2），pageCanvas 在其上（z-index: 0），
   scrim 在最上层（z-index: 0），形成「木琴 → 装饰 → 遮罩 → 正文」的层次 */
#pageCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;
  pointer-events:none;display:block;opacity:.6}
/* 内容对比度保障层：覆盖在装饰 Canvas 之上、正文之下。
   木琴模式下略微减弱，让磨砂玻璃木琴条若隐若现，同时保证文字可读性 */
#pageScrim{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(180deg,
      transparent 0%,
      var(--scrim) 18%,
      var(--scrim-strong) 32%,
      var(--scrim-strong) 68%,
      var(--scrim) 82%,
      transparent 100%);
  transition:background-color .6s var(--ease)}
main{position:relative;z-index:1}
/* WebGL 木琴画布层级：固定在最底层，作为动态背景 */
#canvas{position:fixed;inset:0;z-index:-2;width:100%!important;height:100%!important;
  pointer-events:none;display:block;transition:filter .6s ease}
/* 浅色主题下：给木琴加一层柔光滤镜，让磨砂玻璃条在浅色背景下也有通透感 */
html[data-theme="light"] #canvas{filter:brightness(1.15) saturate(.9) contrast(.95)}
/* 深色主题下：木琴原色呈现，赛博朋克质感拉满 */
html[data-theme="dark"] #canvas{filter:brightness(1) saturate(1.1) contrast(1.05)}
/* 覆盖木琴 base.css 对 body 的锁定，保证简历页面可正常滚动
   （木琴 canvas 是 fixed 定位，不依赖 body 滚动控制） */
html,body{height:auto;overflow:visible;overscroll-behavior:none}
body{position:static;inset:auto;touch-action:pan-y}
/* 封面模式没有任何可滚动内容，禁止浏览器原生平移/回弹：
   否则移动端在空白处向上拖动木琴时，浏览器会连带把整页拖下去，
   顶部露出空白带（下拉刷新/橡皮筋效果）。聚焦模式仍保留 pan-y 以便正文滚动。
   用 pinch-zoom 而非 none：同样禁用平移，但保留双指缩放（无障碍）。
   不支持 pinch-zoom 的老内核回退到 none，效果一致。 */
body.menu:not(.focus){touch-action:none;touch-action:pinch-zoom}
/* 声音按钮：静音状态隐藏波纹、显示斜杠 */
#sound-toggle.is-muted .sound-toggle__wave{display:none}
#sound-toggle.is-muted .sound-toggle__slash{display:block}
/* 木琴加载动画覆盖层：与原页面开场页共存，木琴就绪后自动消失 */
body.loading::before,body.loading::after{z-index:999}
/* 玻璃卡片：微调透明度，让木琴背景若隐若现
   浅色主题略实（保证文字可读），深色主题略透（木琴更明显） */
html[data-theme="light"] .card,
html[data-theme="light"] .stat,
html[data-theme="light"] .ov-card,
html[data-theme="light"] .hero-card{background:rgba(255,255,255,.68)}
html[data-theme="dark"] .card,
html[data-theme="dark"] .stat,
html[data-theme="dark"] .ov-card,
html[data-theme="dark"] .hero-card{background:rgba(13,18,32,.62)}
@media print{#pageCanvas{display:none!important}#pageScrim{display:none!important}#canvas{display:none!important}}
/* 移动端：装饰本就精简，遮罩略减弱，保留背景通透感 */
@media(max-width:640px){
  :root{--scrim:rgba(255,255,255,.22);--scrim-strong:rgba(255,255,255,.42)}
  html[data-theme="dark"]{--scrim:rgba(5,7,15,.26);--scrim-strong:rgba(5,7,15,.48)}
}
h1,h2,h3,h4{margin:0;line-height:1.3}
p{margin:0}a{color:inherit}ul{margin:0;padding:0;list-style:none}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}

/* 开场页锁滚动（仅由 JS 添加，脚本失效时正文天然可见，绝不白屏） */
body.locked{overflow:hidden}
.nav,main,.footer,.totop{transition:opacity .75s ease}
main,.footer{transition:opacity .75s ease,transform .85s cubic-bezier(.22,.7,.25,1)}
body.locked .nav,body.locked main,body.locked .footer,body.locked .totop{opacity:0;pointer-events:none}
body.locked main,body.locked .footer{transform:translateY(28px)}
html.intro-skip #intro{display:none!important}
html.intro-skip body.locked{overflow:auto}
html.intro-skip .nav,html.intro-skip main,html.intro-skip .footer,html.intro-skip .totop{opacity:1!important;pointer-events:auto!important}
html.intro-skip main,html.intro-skip .footer{transform:none!important}

.wrap{width:min(920px,100% - 40px);margin-inline:auto}
@media(max-width:640px){.wrap{width:min(920px,100% - 28px)}}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:var(--brand);color:#fff;padding:10px 18px;border-radius:0 0 10px 0;font-weight:700;text-decoration:none}
.skip:focus{left:0}
.ico-wrap{display:inline-flex;align-items:center;flex:0 0 auto}

/* ============ 顶部全局滚动进度条（h-1，cyan → emerald 渐变） ============ */
#progressTrack{position:fixed;top:0;left:0;width:100%;height:4px;z-index:96;pointer-events:none}
#progressFill{height:100%;width:100%;transform:scaleX(0);transform-origin:0 50%;will-change:transform;
  background:linear-gradient(90deg,#22d3ee 0%,#34d399 100%);
  box-shadow:0 0 12px rgba(34,211,238,.45),0 0 4px rgba(52,211,153,.4)}
@media print{#progressTrack{display:none!important}}

/* ============ 首屏打字机叙事 ============ */
.hero-type{margin-top:12px;display:flex;align-items:center;min-height:1.75em;
  font-size:clamp(1.02rem,2.4vw,1.34rem);font-weight:800;letter-spacing:.02em;line-height:1.5}
#typeText{background:linear-gradient(92deg,#06b6d4,#10b981);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.type-cursor{display:inline-block;width:3px;height:1.12em;margin-left:4px;border-radius:2px;flex:0 0 auto;
  background:linear-gradient(180deg,#22d3ee,#34d399);
  animation:cursorBreathe 1.15s ease-in-out infinite}
/* 呼吸感闪烁光标：柔和明暗 + 轻微伸缩，而非硬切换 */
@keyframes cursorBreathe{0%,100%{opacity:1;transform:scaleY(1)}50%{opacity:.15;transform:scaleY(.8)}}

/* ============ 滚动渐入 / 方向滑入 / 视差 ============
   基础规则（.rv/.rv-armed/.rv-in/方向变体/[data-parallax]）已抽离至
   scroll-effects.css（可复用、可重复触发），由 <link> 引入。
   此处仅保留 index.html 自身主题相关的增强规则。 */

/* ============ 交互反馈：彩带画布 + 气泡 ============ */
#fxCanvas{position:fixed;inset:0;z-index:1001;pointer-events:none;display:block}
@media print{#fxCanvas{display:none!important}}
.fxBubble{position:fixed;z-index:1002;transform:translate(-50%,-100%);pointer-events:none;
  padding:9px 18px;border-radius:16px 16px 16px 4px;white-space:nowrap;
  background:linear-gradient(135deg,#0891b2,#059669);color:#fff;
  font-size:.83rem;font-weight:750;letter-spacing:.02em;
  box-shadow:0 14px 32px -14px rgba(5,150,105,.9);
  animation:bubblePop 2s ease forwards}
@keyframes bubblePop{
  0%{opacity:0;transform:translate(-50%,-80%) scale(.72)}
  14%{opacity:1;transform:translate(-50%,-120%) scale(1)}
  72%{opacity:1;transform:translate(-50%,-135%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-190%) scale(.97)}
}
/* ============ 开场页 ============ */
#intro{position:fixed;inset:0;z-index:1000;overflow:hidden;
  background:radial-gradient(ellipse 62% 56% at 50% 42%,#141b3d 0%,#080c1c 46%,#02030a 100%);
  opacity:1;visibility:visible;
  transition:opacity .8s cubic-bezier(.4,0,.2,1),visibility .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1),filter .8s cubic-bezier(.4,0,.2,1);
  -webkit-user-select:none;user-select:none}
#intro[hidden]{display:none}
#intro.hidden{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.06);filter:blur(10px)}
#starCanvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#starCanvas:active{cursor:grabbing}
.intro-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px;text-align:center;pointer-events:none}
.intro-kicker{font-size:.68rem;font-weight:700;letter-spacing:.52em;text-indent:.52em;color:rgba(129,140,248,.82);text-transform:uppercase;animation:introIn .8s cubic-bezier(.22,.7,.25,1) .1s both}
.intro-title{max-width:15em;font-size:clamp(1.45rem,4.8vw,2.85rem);font-weight:800;line-height:1.42;letter-spacing:.01em;
  background:linear-gradient(118deg,#eef2ff 0%,#a5b4fc 46%,#7dd3fc 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(129,140,248,.45));
  animation:introIn .9s cubic-bezier(.22,.7,.25,1) .22s both}
.intro-sub{font-size:.82rem;font-weight:600;letter-spacing:.16em;color:rgba(148,163,184,.78);animation:introIn .9s cubic-bezier(.22,.7,.25,1) .38s both}
.intro-btn-wrap{pointer-events:auto;margin-top:12px;animation:introIn .9s cubic-bezier(.22,.7,.25,1) .5s both}
.intro-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;padding:15px 58px;border-radius:999px;
  border:1px solid rgba(165,180,252,.6);
  background:linear-gradient(135deg,rgba(79,70,229,.92),rgba(14,165,233,.9));
  color:#fff;font-size:1rem;font-weight:750;letter-spacing:.24em;text-indent:.24em;cursor:pointer;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:transform .22s ease,border-color .22s ease;
  animation:breathe 2.8s ease-in-out 1.35s infinite}
.intro-btn::before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transform:skewX(-18deg);animation:sheen 3.6s ease-in-out 1.8s infinite;pointer-events:none}
.intro-btn:hover{transform:translateY(-2px) scale(1.03);border-color:rgba(199,210,254,.95)}
.intro-btn:active{transform:translateY(0) scale(.99)}
@keyframes introIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(129,140,248,.5),0 0 24px rgba(99,102,241,.5),inset 0 1px 0 rgba(255,255,255,.22)}
  50%{box-shadow:0 0 0 18px rgba(129,140,248,0),0 0 56px rgba(99,102,241,.85),inset 0 1px 0 rgba(255,255,255,.34)}}
@keyframes sheen{0%{left:-70%}45%{left:130%}100%{left:130%}}
@media(max-width:640px){.intro-btn{padding:13px 42px;font-size:.92rem;letter-spacing:.18em;text-indent:.18em}.intro-sub{font-size:.74rem;letter-spacing:.1em}}

/* ============ 导航 ============ */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;background:transparent;
  border-bottom:1px solid transparent;
  transition:border-color .25s ease,box-shadow .25s ease,background-color .3s ease,opacity .75s ease}
.nav.scrolled{border-bottom-color:transparent;box-shadow:none}
.nav-inner{width:min(1080px,100% - 40px);margin-inline:auto;height:64px;display:flex;align-items:center;gap:12px}
@media(max-width:640px){.nav-inner{width:min(1080px,100% - 24px);gap:8px}}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:0 0 auto}
.brand-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-weight:800;font-size:15px;box-shadow:0 8px 18px -10px rgba(79,70,229,.9);overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-size:.94rem;font-weight:800;letter-spacing:.02em}
.brand-text small{font-size:.68rem;color:var(--muted);letter-spacing:.06em}
@media(max-width:860px){.brand-text{display:none}}
/* 顶部导航不再显示亮点/证书等文字，导航整体透明化 */
.nav-links{display:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-link{padding:7px 13px;border-radius:999px;font-size:.86rem;font-weight:600;color:var(--muted);text-decoration:none;white-space:nowrap;position:relative;
  transition:color var(--dur-fast) var(--ease),background-color var(--dur-fast) var(--ease)}
.nav-link:hover,.nav-link.active{color:var(--brand);background:var(--brand-soft)}
/* 激活项底部短横：以 scaleX 从中心展开，不产生布局位移 */
.nav-link::after{content:"";position:absolute;left:50%;bottom:1px;width:14px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,var(--brand),var(--brand-2));
  transform:translateX(-50%) scaleX(0);transform-origin:center;
  transition:transform var(--dur) var(--ease-out)}
.nav-link.active::after{transform:translateX(-50%) scaleX(1)}
/* 键盘遍历导航：焦点即高亮，避免只能靠鼠标辨认当前位置 */
.nav-link:focus-visible{color:var(--brand);background:var(--brand-soft)}
@media(max-width:640px){.nav-link{padding:6px 10px;font-size:.79rem}}
.nav-actions{display:flex;gap:6px;flex:0 0 auto;margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--glass-edge);box-shadow:0 0 0 1px var(--glass-stroke) inset,inset 0 1px 0 var(--glass-hi);color:var(--muted);cursor:pointer;-webkit-backdrop-filter:saturate(150%) blur(10px);backdrop-filter:saturate(150%) blur(10px);transition:transform var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),box-shadow var(--dur) var(--ease-out)}
.icon-btn:hover{color:var(--brand);border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.icon-btn:active{transform:translateY(0) scale(.94)}

/* ============ 通用 ============ */
.card{background:var(--card);border:1px solid var(--glass-edge);border-radius:var(--radius);
  box-shadow:var(--shadow-sm),0 0 0 1px var(--glass-stroke) inset,inset 0 1px 0 var(--glass-hi);
  -webkit-backdrop-filter:saturate(160%) blur(14px);backdrop-filter:saturate(160%) blur(14px);
  transition:transform var(--dur) var(--ease-out),box-shadow var(--dur) var(--ease-out),
             border-color var(--dur) var(--ease-out),background-color .5s var(--ease)}
/* 悬停上浮：位移更克制（-2px 而非 -3px），配合缓动出场曲线手感更顺 */
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 0 0 1px var(--glass-stroke) inset,inset 0 1px 0 var(--glass-hi);border-color:var(--brand)}
/* 有浮起的卡片在按下时压回，给出触觉反馈 */
.card:active{transform:translateY(-1px) scale(.995)}
.section{padding:var(--gap-sec) 0 0}
.sec-title{display:flex;align-items:center;gap:12px;margin-bottom:var(--gap-block);flex-wrap:wrap}
/* 区块标题层级：图标 + 主标题 + 英文副标，形成明确的主次关系 */
.sec-head{position:relative}
.sec-title .sec-en{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);opacity:.62;margin-left:auto;white-space:nowrap}
@media(max-width:640px){.sec-title .sec-en{display:none}}
/* 标题短横线装饰：加强区块起点识别，不占额外高度 */
.sec-title::after{content:"";flex:1 1 40px;height:1px;order:1;
  background:linear-gradient(90deg,var(--line),transparent);margin-left:4px}
.sec-title .sec-en{order:2;margin-left:8px}
.sec-ico{width:36px;height:36px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;
  color:var(--brand);background:var(--brand-soft);border:1px solid var(--line);
  box-shadow:0 4px 12px -6px var(--brand);
  transition:transform var(--dur) var(--ease-spring),background-color var(--dur) var(--ease),color var(--dur-fast) var(--ease)}
.sec-title:hover .sec-ico{transform:rotate(-6deg) scale(1.06);background:var(--brand);color:#fff}
.sec-title h2,h2.sec-title{font-size:1.28rem;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;gap:11px}
.chip{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.72rem;font-weight:700;color:var(--brand);background:var(--brand-soft);border:1px solid var(--line);white-space:nowrap}
.time{font-size:.76rem;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:4px 11px;border-radius:999px;white-space:nowrap;border:1px solid var(--line)}

/* ============ 两侧边缘装饰（仅宽屏可见，不遮挡正文） ============ */
.edge{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
@media(min-width:1440px){.edge{display:block}}
.edge i{position:absolute;display:block}
.edge .e-orb{width:340px;height:340px;border-radius:50%;filter:blur(46px);opacity:.5}
.edge .e-orb.o1{left:-150px;top:16vh;background:radial-gradient(circle,var(--aur1),transparent 66%)}
.edge .e-orb.o2{right:-160px;top:48vh;background:radial-gradient(circle,var(--aur2),transparent 66%);animation:orbFloat 22s ease-in-out infinite}
.edge .e-orb.o3{left:-120px;bottom:6vh;background:radial-gradient(circle,var(--aur3),transparent 66%);animation:orbFloat 27s ease-in-out 3s infinite reverse}
@keyframes orbFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(14px,-34px,0)}}
.edge .e-ruler{top:14vh;bottom:14vh;width:22px;opacity:.5}
.edge .e-ruler.l{left:44px;border-left:1px solid var(--line)}
.edge .e-ruler.r{right:44px;border-right:1px solid var(--line)}
.edge .e-ruler span{position:absolute;height:1px;background:var(--line)}
.edge .e-ruler.l span{left:0}
.edge .e-ruler.r span{right:0}
.edge .e-ruler span.tick{width:9px}
.edge .e-ruler span.minor{width:5px;opacity:.55}
.edge .e-ruler span.major{width:14px;background:linear-gradient(90deg,var(--brand),var(--line))}
.edge .e-ruler.r span.major{background:linear-gradient(270deg,var(--brand),var(--line))}
.edge .e-tag{position:absolute;font-size:.62rem;font-weight:700;letter-spacing:.34em;
  color:var(--muted);opacity:.42;text-transform:uppercase;white-space:nowrap}
.edge .e-tag.l{left:50px;transform:rotate(180deg);writing-mode:vertical-rl}
.edge .e-tag.r{right:50px;writing-mode:vertical-rl}
.edge .e-tag.t1{top:22vh}
.edge .e-tag.t2{bottom:24vh}
.edge .e-tag .dot{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));margin-bottom:10px;
  box-shadow:0 0 0 4px var(--brand-soft)}
.edge .e-shape{opacity:.3}
.edge .e-shape circle,.edge .e-shape rect,.edge .e-shape path,.edge .e-shape line{
  fill:none;stroke:var(--brand);stroke-width:1}
.edge .e-shape .dim{stroke:var(--line)}
.edge .e-sh1{left:38px;top:6vh;width:120px;height:120px;animation:spinSlow 90s linear infinite}
.edge .e-sh2{right:34px;bottom:10vh;width:150px;height:150px;animation:spinSlow 120s linear infinite reverse}
.edge .e-sh3{right:70px;top:9vh;width:80px;height:80px;opacity:.22}
.edge .e-sh4{left:74px;bottom:12vh;width:96px;height:96px;opacity:.22;animation:driftSlow 34s ease-in-out infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes driftSlow{0%,100%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(0,-20px,0) rotate(12deg)}}
.edge .e-corner{width:120px;height:120px;border:1px solid var(--line);opacity:.55}
.edge .e-corner.tl{left:26px;top:26px;border-right-color:var(--brand);border-bottom-color:var(--brand);border-radius:0 0 0 22px}
.edge .e-corner.br{right:26px;bottom:26px;border-left-color:var(--brand);border-top-color:var(--brand);border-radius:22px 0 0 0}

.pulse{width:8px;height:8px;border-radius:50%;background:#22c55e;flex:0 0 auto;box-shadow:0 0 0 0 rgba(34,197,94,.55);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

/* ============ Hero（含大头照） ============ */
.hero{padding:104px 0 6px;position:relative}
.hero::before{content:"";position:absolute;left:50%;top:-90px;transform:translateX(-50%);
  width:min(1180px,120%);height:520px;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 58% 62% at 50% 50%,var(--glow1),transparent 70%);
  filter:blur(6px)}
.hero > .wrap{position:relative;z-index:1}
.hero-card{position:relative;overflow:hidden;border-radius:26px;padding:clamp(24px,4vw,46px);
  background:var(--card);
  border:1px solid var(--glass-edge);
  box-shadow:var(--shadow-lg),0 0 0 1px var(--glass-stroke) inset,inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.12);
  -webkit-backdrop-filter:saturate(160%) blur(10px);backdrop-filter:saturate(160%) blur(10px);
  transition:background-color .5s ease,box-shadow .5s ease}
.hero-card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--brand-2),var(--accent))}
.hero-card::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 88% 108%,var(--glow1),transparent 58%),
    radial-gradient(circle at 6% -14%,var(--glow2),transparent 52%),
    linear-gradient(180deg,transparent 62%,var(--brand-soft))}
.hero-inner{position:relative;z-index:1}

.hero-grid{
  display:grid;
  gap:clamp(22px,3.6vw,44px);
  grid-template-columns:minmax(0,1fr) 196px;
  align-items:start;
}
@media(max-width:880px){
  .hero-grid{grid-template-columns:1fr;gap:24px}
  .hero-avatar{order:-1;justify-self:center}
}

/* —— 大头照 —— */
.hero-avatar{position:relative;justify-self:end}
.avatar-ring{
  position:relative;
  width:196px;height:196px;border-radius:50%;
  padding:5px;
  background:linear-gradient(140deg,var(--brand),var(--brand-2) 55%,var(--accent));
  box-shadow:0 22px 48px -22px rgba(79,70,229,.9);
  transition:transform .3s ease,box-shadow .3s ease;
}
.avatar-ring::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;
  border:1px dashed var(--line);
}
.hero-avatar:hover .avatar-ring{
  transform:translateY(-4px) scale(1.015);
  box-shadow:0 30px 60px -26px rgba(79,70,229,1);
}
.avatar-ring img{
  width:100%;height:100%;border-radius:50%;
  object-fit:cover;object-position:center 22%;
  display:block;
  background:var(--brand-soft);
  transition:transform .4s ease;
}
.hero-avatar:hover .avatar-ring img{transform:scale(1.045)}
.avatar-ring.failed{
  background:var(--brand-soft);
  box-shadow:none;
}
.avatar-ring.failed::before{
  content:"照片未找到";
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:.72rem;font-weight:700;color:var(--muted);
  z-index:2;white-space:nowrap;
}
.avatar-ring.failed img{opacity:0}

.avatar-badge{
  position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 14px;border-radius:999px;
  font-size:.72rem;font-weight:800;letter-spacing:.02em;
  color:#fff;white-space:nowrap;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));
  box-shadow:0 10px 22px -12px rgba(79,70,229,.95);
  border:2px solid var(--card);
  z-index:3;
}
@media(max-width:880px){
  .avatar-ring{width:158px;height:158px}
  .avatar-badge{font-size:.68rem;padding:4px 12px}
}

.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:650;color:var(--muted);background:var(--brand-soft);border:1px solid var(--line);padding:5px 14px;border-radius:999px}
.hero-name{margin:16px 0 6px;font-size:clamp(2.1rem,5.4vw,3.4rem);font-weight:800;letter-spacing:-.02em;line-height:1.12;
  background:linear-gradient(118deg,var(--text) 22%,var(--brand) 62%,var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-headline{font-size:clamp(.98rem,2vw,1.12rem);font-weight:700;color:var(--brand);letter-spacing:.01em}
.hero-summary{margin-top:14px;max-width:66ch;font-size:.93rem;color:var(--muted);line-height:1.9}

.contact-bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.contact-item{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--text);font-size:.84rem;font-weight:650;text-decoration:none;cursor:pointer;white-space:nowrap;
  transition:transform var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),box-shadow var(--dur) var(--ease-out),background-color var(--dur-fast) var(--ease)}
.contact-item .ico-wrap{color:var(--brand)}
.contact-item:hover{transform:translateY(-2px);border-color:var(--brand);color:var(--brand);box-shadow:var(--shadow-sm)}
.contact-item:active{transform:translateY(0) scale(.97)}
.contact-item.static{cursor:default}
.contact-item.static:hover{transform:none;color:var(--text);border-color:var(--line);box-shadow:none}
.contact-item .copy-hint{font-size:.72rem;color:var(--muted);font-weight:600}
.contact-item:hover .copy-hint{color:var(--brand)}
@media(max-width:640px){.contact-item{padding:8px 13px;font-size:.79rem}}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tag{display:inline-flex;align-items:center;padding:5px 13px;border-radius:999px;font-size:.78rem;font-weight:600;color:var(--muted);background:var(--brand-soft);border:1px solid var(--line);cursor:default;
  transition:transform var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),box-shadow var(--dur) var(--ease-out)}
.tag:hover{transform:translateY(-2px);color:var(--brand);border-color:var(--brand);box-shadow:0 6px 14px -8px var(--brand)}

/* ============ 亮点 ============ */
.stats{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{padding:20px 20px 18px;border-radius:var(--radius);background:var(--card);border:1px solid var(--glass-edge);box-shadow:var(--shadow-sm),0 0 0 1px var(--glass-stroke) inset,inset 0 1px 0 var(--glass-hi);position:relative;overflow:hidden;
  transition:transform var(--dur) var(--ease-out),box-shadow var(--dur) var(--ease-out),border-color var(--dur) var(--ease-out),background-color .5s var(--ease)}
.stat::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));transform:scaleX(0);transform-origin:left;
  transition:transform var(--dur-slow) var(--ease-out)}
.stat:hover{transform:translateY(-3px);box-shadow:var(--shadow),0 0 0 1px var(--glass-stroke) inset,inset 0 1px 0 var(--glass-hi);border-color:var(--brand)}
.stat:hover::after{transform:scaleX(1)}
.stat:active{transform:translateY(-1px) scale(.995)}
.stat .st-idx{position:absolute;top:12px;right:14px;font-size:.68rem;font-weight:800;
  letter-spacing:.1em;color:var(--brand);opacity:.3;font-variant-numeric:tabular-nums}
.stat .st-arc{position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;
  border:1px solid var(--line);pointer-events:none}
.stat .st-arc::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px dashed var(--line)}
.stat .num{font-size:clamp(1.7rem,3.2vw,2.2rem);font-weight:800;line-height:1;color:var(--brand);letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px}
.stat .num span{font-size:.85rem;font-weight:700;margin-left:2px;color:var(--muted)}
.stat .st-spark{display:flex;align-items:flex-end;gap:3px;height:18px;margin-top:12px}
.stat .st-spark i{flex:1 1 0;border-radius:2px 2px 0 0;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));opacity:.28;
  transform-origin:bottom;transform:scaleY(.2);transition:transform .7s cubic-bezier(.22,.7,.25,1)}
.stat:hover .st-spark i{opacity:.5}
.rv-in .stat .st-spark i{transform:scaleY(1)}
.stat .st-spark i:nth-child(1){transition-delay:.05s}
.stat .st-spark i:nth-child(2){transition-delay:.10s}

<script>
/* ============================================================
   开场页：动态星轨 Canvas（原生实现，无外部库）

(function(){
  'use strict';
  var introEl=document.getElementById('intro');
  var canvas=document.getElementById('starCanvas');
  var startBtn=document.getElementById('startBtn');
  var SKIP=document.documentElement.classList.contains('intro-skip');

  if(SKIP||!introEl||!canvas||!startBtn){
    if(introEl) introEl.hidden=true;

    return;
  }
  introEl.hidden=false;

  var ctx=canvas.getContext('2d');
  var TAU=Math.PI*2, FOCAL=1700;
  var W=0,H=0,DPR=1,bgGrad=null;
  var rotX=-0.30,rotY=0.62,zoom=1;
  var dragging=false,lastX=0,lastY=0,velX=0,velY=0;
  var rafId=null,running=true;
  var stars=[];
  var lastNow=0;

  function hexA(hex,a){
    var n=parseInt(hex.slice(1),16);
    return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
  }

  function project(p){
    var cy=Math.cos(rotY),sy=Math.sin(rotY);
    var cx=Math.cos(rotX),sx=Math.sin(rotX);
    var x1=p.x*cy-p.z*sy, z1=p.x*sy+p.z*cy;
    var y1=p.y*cx-z1*sx,  z2=p.y*sx+z1*cx;
    var d=FOCAL+z2;
    if(d<90) return null;
    var s=(FOCAL*zoom)/d;
    return {x:W/2+x1*s, y:H/2+y1*s, s:s, z:z2};
  }

  var orbits=[
    {radius:175,tiltX:0.06,tiltZ:0.04,speed:0.58,dir:1,color:'#38bdf8',bodies:[{phase:0.4}]},
    {radius:262,tiltX:-0.30,tiltZ:0.20,speed:0.42,dir:-1,color:'#818cf8',bodies:[{phase:1.3},{phase:4.2}]},
    {radius:352,tiltX:0.44,tiltZ:-0.24,speed:0.31,dir:1,color:'#a78bfa',bodies:[{phase:2.5}]},
    {radius:452,tiltX:-0.17,tiltZ:0.38,speed:0.23,dir:-1,color:'#f59e0b',bodies:[{phase:0.7},{phase:3.7}]},
    {radius:566,tiltX:0.31,tiltZ:0.11,speed:0.165,dir:1,color:'#22d3ee',bodies:[{phase:2.1}]},
    {radius:694,tiltX:-0.42,tiltZ:-0.30,speed:0.115,dir:-1,color:'#e879f9',bodies:[{phase:5.1}]}
  ];

  function orbitPoint(o,a){
    var x=Math.cos(a)*o.radius, y=0, z=Math.sin(a)*o.radius;
    var cx=Math.cos(o.tiltX),sx=Math.sin(o.tiltX);
    var y1=y*cx-z*sx, z1=y*sx+z*cx;
    var cz=Math.cos(o.tiltZ),sz=Math.sin(o.tiltZ);
    var x1=x*cz-y1*sz, y2=x*sz+y1*cz;
    return {x:x1,y:y2,z:z1};
  }

  function buildStars(){
    stars.length=0;
    var count=Math.round(Math.min(520,Math.max(240,(W*H)/4200)));
    for(var i=0;i<count;i++){
      var r=420+Math.random()*980, th=Math.random()*TAU, ph=Math.acos(2*Math.random()-1), sp=Math.sin(ph);
      stars.push({

        tw:0.5+Math.random()*1.9, off:Math.random()*TAU

    }
  }

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.max(1,Math.round(W*DPR));
    canvas.height=Math.max(1,Math.round(H*DPR));

    ctx.setTransform(DPR,0,0,DPR,0,0);
    bgGrad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.62);

    bgGrad.addColorStop(0.42,'rgba(56,189,248,0.05)');
    bgGrad.addColorStop(1,'rgba(0,0,0,0)');
    buildStars();
  }

  /* —— 主题判定：跟随 <html data-theme="dark"> —— */
  function isDark(){
    return document.documentElement.getAttribute('data-theme')==='dark';
  }

  /* ===================== 流星系统（深色模式） ===================== */
  var meteors=[];
  var meteorNextAt=0;
  var METEOR_MIN_GAP=2000;
  var METEOR_MAX_GAP=8000;

  function scheduleMeteor(now){
    meteorNextAt=now+METEOR_MIN_GAP+Math.random()*(METEOR_MAX_GAP-METEOR_MIN_GAP);
  }

  function spawnMeteor(){
    var speed=0.55+Math.random()*1.15;
    var ang=(22+Math.random()*26)*Math.PI/180;
    var dir=Math.random()<0.5?1:-1;

    var from='top';
    var r=Math.random();
    if(r<0.62) from='top';
    else if(r<0.81) from='left';
    else from='right';

    var x,y;
    if(from==='top'){
      x=Math.random()*(W*1.1)-W*0.05;
      y=-40-Math.random()*80;
    }else if(from==='left'){
      x=-60-Math.random()*80;
      y=Math.random()*H*0.55;
    }else{
      x=W+60+Math.random()*80;
      y=Math.random()*H*0.55;
    }

    var vx=Math.cos(ang)*speed*dir;
    var vy=Math.sin(ang)*speed;
    if(from==='left'&&vx<0) vx=-vx;
    if(from==='right'&&vx>0) vx=-vx;

    meteors.push({
      x:x, y:y,
      vx:vx, vy:vy,
      len:110+Math.random()*190,
      w:1.1+Math.random()*1.5,
      hue:Math.random()<0.72?'255,255,255':'186,230,255',
      life:0, maxLife:2600+Math.random()*1800

  }

  function drawMeteors(dt){
    for(var i=meteors.length-1;i>=0;i--){
      var m=meteors[i];
      m.x+=m.vx*dt; m.y+=m.vy*dt; m.life+=dt*16.7;

      var margin=m.len+80;
      if(m.x<-margin||m.x>W+margin||m.y<-margin||m.y>H+margin||m.life>m.maxLife){
        meteors.splice(i,1);
        continue;
      }

      var sp=Math.hypot(m.vx,m.vy)||1;
      var ux=m.vx/sp, uy=m.vy/sp;
      var tx=m.x-ux*m.len, ty=m.y-uy*m.len;

      var g=ctx.createLinearGradient(m.x,m.y,tx,ty);
      g.addColorStop(0,'rgba('+m.hue+',0.95)');
      g.addColorStop(0.18,'rgba('+m.hue+',0.55)');
      g.addColorStop(0.55,'rgba('+m.hue+',0.16)');
      g.addColorStop(1,'rgba('+m.hue+',0)');
      ctx.strokeStyle=g;
      ctx.lineWidth=m.w;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(m.x,m.y);
      ctx.lineTo(tx,ty);
      ctx.stroke();

      var hr=m.w*4.2;
      var hg=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,hr);
      hg.addColorStop(0,'rgba(255,255,255,0.95)');
      hg.addColorStop(0.35,'rgba('+m.hue+',0.5)');
      hg.addColorStop(1,'rgba('+m.hue+',0)');
      ctx.fillStyle=hg;
      ctx.beginPath(); ctx.arc(m.x,m.y,hr,0,TAU); ctx.fill();

      ctx.fillStyle='rgba(255,255,255,0.98)';
      ctx.beginPath(); ctx.arc(m.x,m.y,Math.max(0.9,m.w*0.85),0,TAU); ctx.fill();
    }
  }

  function draw(now){
    var t=now*0.001;
    var dt=lastNow?Math.min((now-lastNow)/16.7,3):1;
    if(!dragging){
      rotY+=velY; rotX+=velX;
      velY*=0.95; velX*=0.95;
      if(Math.abs(velY)<2e-5) velY=0;
      if(Math.abs(velX)<2e-5) velX=0;
      rotY+=0.00035;
      if(rotX>1.15) rotX=1.15;
      if(rotX<-1.15) rotX=-1.15;
    }
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    if(bgGrad){ ctx.fillStyle=bgGrad; ctx.fillRect(0,0,W,H); }

    var dark=isDark();

    ctx.globalCompositeOperation='lighter';
    for(var i=0;i<stars.length;i++){
      var st=stars[i];
      var p=project(st);
      if(!p) continue;
      if(p.x<-50||p.x>W+50||p.y<-50||p.y>H+50) continue;
      var tw=0.55+0.45*Math.sin(t*st.tw+st.off);
      var rad=Math.max(0.4,Math.min(st.r*p.s,2.6));
      var al=Math.min(1,st.a*tw*(0.55+p.s*0.45));
      ctx.beginPath();
      ctx.arc(p.x,p.y,rad,0,TAU);
      ctx.fillStyle='rgba(214,225,255,'+al.toFixed(3)+')';
      ctx.fill();
    }

    ctx.globalCompositeOperation='source-over';
    for(var oi=0;oi<orbits.length;oi++){
      var o=orbits[oi], SEG=72, pen=false;
      ctx.beginPath();
      for(var k=0;k<=SEG;k++){
        var a=(k/SEG)*TAU;
        var op=project(orbitPoint(o,a));
        if(!op){ pen=false; continue; }
        if(pen) ctx.lineTo(op.x,op.y);
        else { ctx.moveTo(op.x,op.y); pen=true; }
      }
      ctx.strokeStyle=hexA(o.color,0.13);
      ctx.lineWidth=1;
      ctx.stroke();
    }

    ctx.globalCompositeOperation='lighter';
    for(var oj=0;oj<orbits.length;oj++){
      var ob=orbits[oj];
      for(var bi=0;bi<ob.bodies.length;bi++){
        var b=ob.bodies[bi];
        var head=t*ob.speed*ob.dir+b.phase;
        var TRAIL=18;
        for(var m=TRAIL;m>=1;m--){
          var ta=head-m*0.016*ob.dir;
          var tp=project(orbitPoint(ob,ta));
          if(!tp) continue;
          var f=1-m/TRAIL;
          var tRad=Math.max(0.5,(0.8+3.2*f)*Math.min(tp.s,1.6));
          ctx.beginPath();
          ctx.arc(tp.x,tp.y,tRad,0,TAU);
          ctx.fillStyle=hexA(ob.color,0.05+0.42*f*f);
          ctx.fill();
        }
        var hp=project(orbitPoint(ob,head));
        if(hp){
          var R=Math.max(9,20*Math.min(hp.s,1.6));
          var g=ctx.createRadialGradient(hp.x,hp.y,0,hp.x,hp.y,R);
          g.addColorStop(0,'rgba(255,255,255,0.95)');
          g.addColorStop(0.18,hexA(ob.color,0.85));
          g.addColorStop(0.55,hexA(ob.color,0.22));
          g.addColorStop(1,hexA(ob.color,0));
          ctx.fillStyle=g;
          ctx.beginPath(); ctx.arc(hp.x,hp.y,R,0,TAU); ctx.fill();
          ctx.beginPath();
          ctx.arc(hp.x,hp.y,Math.max(1.2,2.4*Math.min(hp.s,1.6)),0,TAU);
          ctx.fillStyle='rgba(255,255,255,0.95)';
          ctx.fill();
        }
      }
    }

    if(dark){
      if(now>=meteorNextAt){
        spawnMeteor();
        scheduleMeteor(now);
      }
      ctx.globalCompositeOperation='lighter';
      drawMeteors(dt);
    } else if(meteors.length){
      meteors.length=0;
    }

    ctx.globalCompositeOperation='source-over';
    lastNow=now;
  }

  function loop(now){
    if(!running) return;
    draw(now);
    rafId=window.requestAnimationFrame(loop);
  }

  function onDown(e){
    dragging=true; lastX=e.clientX; lastY=e.clientY; velX=0; velY=0;
    if(canvas.setPointerCapture&&e.pointerId!==undefined){
      try{canvas.setPointerCapture(e.pointerId);}catch(err){}
    }
  }
  function onMove(e){
    if(!dragging) return;
    var dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY;
    rotY+=dx*0.0052; rotX+=dy*0.0036;
    if(rotX>1.15) rotX=1.15;
    if(rotX<-1.15) rotX=-1.15;
    velY=dx*0.0009; velX=dy*0.0006;
  }
  function onUp(){ dragging=false; }

  canvas.addEventListener('pointerdown',onDown);
  canvas.addEventListener('pointermove',onMove);
  window.addEventListener('pointerup',onUp);
  window.addEventListener('pointercancel',onUp);

  canvas.addEventListener('wheel',function(e){
    e.preventDefault();
    zoom*=Math.exp(-e.deltaY*0.0012);
    if(zoom>2.6) zoom=2.6;
    if(zoom<0.42) zoom=0.42;
  },{passive:false});

  var pinchDist=0;
  canvas.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      pinchDist=Math.hypot(dx,dy);
    }
  },{passive:true});
  canvas.addEventListener('touchmove',function(e){
    if(e.touches.length===2){
      e.preventDefault();
      var dx=e.touches[0].clientX-e.touches[1].clientX;
      var dy=e.touches[0].clientY-e.touches[1].clientY;
      var d=Math.hypot(dx,dy);
      if(pinchDist>0){
        zoom*=d/pinchDist;
        if(zoom>2.6) zoom=2.6;
        if(zoom<0.42) zoom=0.42;
      }
      pinchDist=d;
    }
  },{passive:false});
  canvas.addEventListener('touchend',function(){ pinchDist=0; },{passive:true});

  var resizeTimer=null;
  window.addEventListener('resize',function(){
    if(resizeTimer) clearTimeout(resizeTimer);
    resizeTimer=setTimeout(resize,120);
  });

  var started=false;
  function enterSite(ev){
    if(started) return;
    started=true;
    /* 打招呼：在进入正文的同一刻触发彩带 + 气泡（复用全局接口） */
    try{ if(window.__wycGreet) window.__wycGreet(ev); }catch(e){}
    introEl.classList.add('hidden');
    document.body.classList.remove('locked');
    try{ sessionStorage.setItem('wyc-intro-seen','1'); }catch(e){}
    /* 通知主模块：可以启动滚动渐入与数字滚动动画 */
    try{ document.dispatchEvent(new CustomEvent('wyc:enter')); }catch(e){}
    window.scrollTo(0,0);
    setTimeout(function(){
      running=false;
      if(rafId){ window.cancelAnimationFrame(rafId); rafId=null; }
      introEl.hidden=true;
    },950);
  }
  startBtn.addEventListener('click',enterSite);
  startBtn.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); enterSite(e); }
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape') enterSite();
  });

  document.addEventListener('visibilitychange',function(){
    if(document.hidden){
      running=false;
      if(rafId){ window.cancelAnimationFrame(rafId); rafId=null; }
    } else if(!started){
      running=true;
      rafId=window.requestAnimationFrame(loop);
    }
  });

  resize();
  rafId=window.requestAnimationFrame(loop);
})();
</script>

<script>
/* ============================================================
   正文页背景氛围层（原生 Canvas）—— 日夜双主题 + 平滑过渡
   · 白天（iOS 玻璃）：柔光玻璃光斑 / 高光描边 / 柔和渐变 / 浮尘
   · 夜间（赛博朋克机甲）：透视霓虹网格 / 棱镜色散光 / 霓虹散景
     / 扫描线 / 金属冷光
   · 通过 themeMix（0=白天 → 1=夜间）在两种风格间平滑交叉淡入淡出，
     切换主题时由 rAF 缓动逼近目标值
   · 纯装饰：pointer-events:none；页面隐藏自动暂停；DPR 上限 2
   ============================================================ */
(function(){
  'use strict';
  var canvas=document.getElementById('pageCanvas');
  if(!canvas) return;
  var ctx=canvas.getContext('2d');
  var TAU=Math.PI*2;

  var W=0,H=0,DPR=1;
  var rafId=null,running=false,lastNow=0;

  /* —— 主题混合：0=白天，1=夜间，向目标缓动实现平滑过渡 —— */
  var themeMix=0;
  function isDark(){
    return document.documentElement.getAttribute('data-theme')==='dark';
  }
  function rand(a,b){ return a+Math.random()*(b-a); }

  /* ============ 白天：玻璃光斑 / 柔和光晕 / 浮尘 / 小太阳 ============ */
  var dust=[],panes=[],orbs=[];
  var sun={x:0,y:0,r:34};
  var godRays=[],godMotes=[];
  var sunGrain=[];

  function buildDust(){
    dust.length=0;
    /* 浮尘密度下调（原 W/24 → W/34，上限 64 → 44）：
       减少细碎亮点干扰正文，保留空气感即可 */
    var n=Math.round(Math.min(44,Math.max(18,W/34)));
    for(var i=0;i<n;i++){
      dust.push({
        x:Math.random()*W, y:Math.random()*H,
        r:rand(0.8,2.4), vy:-rand(0.08,0.26), vx:rand(-0.1,0.1),
        a:rand(0.10,0.30), tw:rand(0.3,1.0), off:Math.random()*TAU
      });
    }
  }

  /* 小太阳 + 丁达尔光束（右上角，暖色光晕 + 斜射光束 + 颗粒） */
  function buildSun(){
    sun.x=W-Math.min(190,Math.max(120,W*0.16));
    sun.y=Math.max(96,Math.min(150,H*0.14));
    sun.r=Math.max(26,Math.min(40,W*0.035));
    godRays.length=0;
    var n=6, base=Math.PI*0.62;
    for(var i=0;i<n;i++){
      var f=(i-(n-1)/2)/(n-1);
      godRays.push({
        angle:base+f*0.55,
        len:Math.max(H*0.9,Math.hypot(W,H)*0.55)*(0.85+Math.random()*0.3),
        half:sun.r*0.9+Math.random()*sun.r*0.6,
        a:0.05+Math.random()*0.05,
        sway:Math.random()*TAU,
        sp:0.06+Math.random()*0.08
      });
    }
    godMotes.length=0;
    var m=Math.round(Math.min(60,Math.max(28,W/26)));
    for(var j=0;j<m;j++){
      godMotes.push({
        ang:base+(Math.random()-0.5)*0.9,
        dist:Math.random()*Math.max(H*0.85,650),
        sp:rand(0.05,0.2),
        r:rand(0.5,2.0),
        a:rand(0.05,0.17),
        tw:rand(0.3,1.0), off:Math.random()*TAU
      });
    }
    /* 太阳表面颗粒纹理（米粒组织）：更细密、柔和的暖白亮斑。
       颗粒数量下调（原 r²/26 → r²/44）：这是白天主题最大的性能开销，
       每颗粒子都要新建一个径向渐变，减量后绘制负担明显下降，
       肉眼观感几乎无差异（颗粒本就重叠铺满盘面） */
    sunGrain.length=0;
    var g=Math.round(sun.r*sun.r/44);
    for(var k=0;k<g;k++){
      var ga=Math.random()*TAU, gd=Math.sqrt(Math.random())*sun.r*0.94;
      sunGrain.push({
        x:Math.cos(ga)*gd, y:Math.sin(ga)*gd,
        r:rand(0.4,1.3),
        a:rand(0.07,0.20),
        tw:rand(0.4,1.2), off:Math.random()*TAU
      });
    }
  }

  /* 玻璃面板：半透明圆角块，带高光描边，模拟层叠毛玻璃 */
  function buildPanes(){
    panes.length=0;
    /* 面板数量 5 → 3、透明度下调：避免大面积白块削弱正文对比度 */
    var n=3;
    for(var i=0;i<n;i++){
      panes.push({
        x:Math.random()*W, y:Math.random()*H,
        w:rand(120,250), h:rand(70,140),
        r:rand(14,30),
        rot:rand(-0.25,0.25),
        vx:rand(-0.07,0.07), vy:rand(-0.05,0.05),
        a:rand(0.07,0.15), hi:rand(0.08,0.20),
        off:Math.random()*TAU, sp:rand(0.12,0.30)
      });
    }
  }

  /* 柔和光晕：大面积低饱和渐变，明亮通透 */
  function buildOrbs(){
    orbs.length=0;
    var cols=[[147,170,255],[125,200,255],[255,205,150],[240,180,255]];
    var n=4;
    for(var i=0;i<n;i++){
      var c=cols[i%cols.length];
      orbs.push({
        x:rand(0.08,0.92)*W, y:rand(0.08,0.92)*H,
        r:rand(180,340),
        c:c,
        vx:rand(-0.06,0.06), vy:rand(-0.05,0.05),
        a:rand(0.07,0.15), off:Math.random()*TAU, sp:rand(0.10,0.22)
      });
    }
  }

  /* ============ 夜间：棱镜光线 / 霓虹散景 ============ */
  var rays=[],bokehs=[];
  var RAY_COLORS=[[255,60,60],[60,255,140],[70,150,255],[255,160,40],[255,43,214],[90,230,240]];

  function buildRays(){
    rays.length=0;
    /* 棱镜光线数量与亮度下调（原 W/26 → W/38、上限 90 → 64、a .16-.5 → .10-.32）：
       夜间霓虹是正文可读性的最大威胁，主动收敛才能让内容主导视觉 */
    var n=Math.round(Math.min(64,Math.max(26,W/38)));
    for(var i=0;i<n;i++){
      var r={};
      r.angle=Math.random()*TAU;
      r.dist=Math.random()*Math.hypot(W,H)*0.7;
      r.speed=rand(1.5,4.5)*(1+r.dist/360);
      r.len=rand(30,150);
      r.w=rand(0.6,1.9);
      r.color=RAY_COLORS[(Math.random()*RAY_COLORS.length)|0];
      r.a=rand(0.10,0.32);
      rays.push(r);
    }
  }

  function buildBokehs(){
    bokehs.length=0;
    var n=Math.round(Math.min(24,Math.max(12,W/80)));
    for(var i=0;i<n;i++){
      bokehs.push({
        x:Math.random()*W, y:Math.random()*H,
        r:rand(1.5,8),
        c:RAY_COLORS[(Math.random()*RAY_COLORS.length)|0],
        a:rand(0.05,0.20),
        tw:rand(0.4,1.2), off:Math.random()*TAU,
        vx:rand(-0.06,0.06), vy:rand(-0.04,0.04)
      });
    }
  }

  function resize(){
    W=window.innerWidth; H=window.innerHeight;
    /* DPR 上限 2 → 1.75：Canvas 像素级成本随 DPR 平方增长，
       1.75 在高分屏上肉眼几乎无差别，却能省下约 23% 的填充开销。
       窄视口（手机）再降到 1.5，优先保障滚动流畅。 */
    var cap=(W<700)?1.5:1.75;
    DPR=Math.min(window.devicePixelRatio||1,cap);
    canvas.width=Math.max(1,Math.round(W*DPR));
    canvas.height=Math.max(1,Math.round(H*DPR));
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildDust(); buildPanes(); buildOrbs(); buildRays(); buildBokehs(); buildSun();
  }

  /* —— 圆角矩形路径 —— */
  function rr(x,y,w,h,r){
    r=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  /* ============ 白天渲染（iOS 玻璃） ============ */
  /* 小太阳：右上角暖色发光体。
     盘面平滑连续渐变（白热核 → 金黄 → 深琥珀，含临边昏暗）+ 细密米粒组织，
     边缘以「内圈柔亮线 / 暖色临边环 / 柔和外日冕」三层呈现 ——
     轮廓清晰的同时发光过渡自然，光照柔和美观 */
  function drawSun(t,a){
    var sx=sun.x, sy=sun.y, sr=sun.r;
    var breathe=0.90+0.10*Math.sin(t*0.5);

    /* ① 外层暖色大气光晕：平滑自然衰减（近轮廓处收敛，衬托锐利边缘） */
    var R=sr*5.0;
    var g=ctx.createRadialGradient(sx,sy,0,sx,sy,R);
    g.addColorStop(0,'rgba(255,240,192,'+(0.30*a*breathe).toFixed(4)+')');
    g.addColorStop(0.22,'rgba(255,226,162,'+(0.15*a*breathe).toFixed(4)+')');
    g.addColorStop(0.48,'rgba(255,212,140,'+(0.075*a*breathe).toFixed(4)+')');
    g.addColorStop(0.74,'rgba(255,200,120,'+(0.030*a).toFixed(4)+')');
    g.addColorStop(1,'rgba(255,196,118,0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(sx,sy,R,0,TAU); ctx.fill();

    /* ② 中层柔光过渡：让光晕更饱满柔和 */
    var R2=sr*2.6;
    var g2=ctx.createRadialGradient(sx,sy,0,sx,sy,R2);
    g2.addColorStop(0,'rgba(255,249,220,'+(0.42*a*breathe).toFixed(4)+')');
    g2.addColorStop(0.55,'rgba(255,232,170,'+(0.18*a*breathe).toFixed(4)+')');
    g2.addColorStop(1,'rgba(255,220,150,0)');
    ctx.fillStyle=g2;
    ctx.beginPath(); ctx.arc(sx,sy,R2,0,TAU); ctx.fill();

    /* ③-⑤ 盘面：source-over，边缘实、层次自然 */
    ctx.globalCompositeOperation='source-over';
    ctx.save();
    ctx.beginPath(); ctx.arc(sx,sy,sr,0,TAU); ctx.clip();
    /* ③ 太阳本体：白热核 → 暖白 → 金黄 → 深琥珀，平滑连续渐变 + 临边昏暗 */
    var g3=ctx.createRadialGradient(sx,sy,0,sx,sy,sr);
    g3.addColorStop(0.00,'rgba(255,255,253,'+(0.99*a).toFixed(4)+')');
    g3.addColorStop(0.22,'rgba(255,253,240,'+(0.99*a).toFixed(4)+')');
    g3.addColorStop(0.45,'rgba(255,246,215,'+(0.98*a).toFixed(4)+')');
    g3.addColorStop(0.66,'rgba(255,232,172,'+(0.97*a).toFixed(4)+')');
    g3.addColorStop(0.84,'rgba(255,209,118,'+(0.97*a).toFixed(4)+')');
    g3.addColorStop(0.94,'rgba(255,186,76,'+(0.97*a).toFixed(4)+')');
    g3.addColorStop(1.00,'rgba(252,166,56,'+(0.97*a).toFixed(4)+')');
    ctx.fillStyle=g3;
    ctx.fillRect(sx-sr,sy-sr,sr*2,sr*2);

    /* ④ 表面颗粒（米粒组织）：更细密、柔和、暖白，铺满盘面 */
    for(var k=0;k<sunGrain.length;k++){
      var gr=sunGrain[k];
      var gtw=0.6+0.4*Math.sin(t*gr.tw+gr.off);
      var gx=sx+gr.x, gy=sy+gr.y;
      var gg=ctx.createRadialGradient(gx,gy,0,gx,gy,gr.r*3.0);
      gg.addColorStop(0,'rgba(255,252,230,'+(gr.a*gtw*a*0.75).toFixed(4)+')');
      gg.addColorStop(0.6,'rgba(255,244,200,'+(gr.a*gtw*a*0.25).toFixed(4)+')');
      gg.addColorStop(1,'rgba(255,238,190,0)');
      ctx.fillStyle=gg;
      ctx.beginPath(); ctx.arc(gx,gy,gr.r*3.0,0,TAU); ctx.fill();
    }

    /* ⑤ 顶部柔光：向光束方向轻微提亮，增强体积感而不失真 */
    var hg=ctx.createRadialGradient(sx,sy-sr*0.28,0,sx,sy-sr*0.28,sr*1.0);
    hg.addColorStop(0,'rgba(255,255,250,'+(0.34*a*breathe).toFixed(4)+')');
    hg.addColorStop(0.55,'rgba(255,253,240,'+(0.12*a*breathe).toFixed(4)+')');
    hg.addColorStop(1,'rgba(255,250,232,0)');
    ctx.fillStyle=hg;
    ctx.fillRect(sx-sr,sy-sr,sr*2,sr*2);
    ctx.restore();

    /* ⑥ 边缘与日冕：内圈柔亮线（光球层）+ 暖色临边环 + 柔和外日冕，
          既保持清晰轮廓，又让发光过渡更自然 */
    ctx.lineWidth=2.0;
    ctx.strokeStyle='rgba(255,250,226,'+(0.55*a).toFixed(4)+')';
    ctx.beginPath(); ctx.arc(sx,sy,sr-0.8,0,TAU); ctx.stroke();
    ctx.lineWidth=3.0;
    ctx.strokeStyle='rgba(255,176,78,'+(0.30*a*breathe).toFixed(4)+')';
    ctx.beginPath(); ctx.arc(sx,sy,sr+0.4,0,TAU); ctx.stroke();
    ctx.lineWidth=4.5;
    ctx.strokeStyle='rgba(255,150,56,'+(0.10*a*breathe).toFixed(4)+')';
    ctx.beginPath(); ctx.arc(sx,sy,sr+2.2,0,TAU); ctx.stroke();

    ctx.globalCompositeOperation='lighter';
  }

  /* 丁达尔光束：从太阳斜射下来的可见光束，锥形 + 颗粒感 */
  function drawGodRays(t,a){
    var sx=sun.x, sy=sun.y;
    for(var i=0;i<godRays.length;i++){
      var r=godRays[i];
      var ang=r.angle+Math.sin(t*r.sp+r.sway)*0.02;
      var cs=Math.cos(ang), sn=Math.sin(ang);
      /* 光束方向与垂直方向 */
      var px=-sn, py=cs;
      var ex=sx+cs*r.len, ey=sy+sn*r.len;
      /* 锥形：近端窄、远端宽 */
      var w0=sun.r*0.5;
      var w1=r.half*(1+r.len/420);
      var g=ctx.createLinearGradient(sx,sy,ex,ey);
      g.addColorStop(0,'rgba(255,240,190,'+(r.a*1.6*a).toFixed(4)+')');
      g.addColorStop(0.5,'rgba(255,228,160,'+(r.a*a).toFixed(4)+')');
      g.addColorStop(1,'rgba(255,220,150,0)');
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(sx+px*w0, sy+py*w0);
      ctx.lineTo(ex+px*w1, ey+py*w1);
      ctx.lineTo(ex-px*w1, ey-py*w1);
      ctx.lineTo(sx-px*w0, sy-py*w0);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* 光束中的漂浮颗粒：丁达尔效应的尘埃感 */
  function drawGodMotes(t,dt,a){
    for(var i=0;i<godMotes.length;i++){
      var m=godMotes[i];
      /* 沿光束方向缓慢漂移 */
      m.dist+=m.sp*dt;
      if(m.dist>Math.max(H*0.9,650)){ m.dist=rand(10,80); m.ang=Math.PI*0.62+(Math.random()-0.5)*0.9; }
      var cs=Math.cos(m.ang), sn=Math.sin(m.ang);
      var mx=sun.x+cs*m.dist+Math.sin(t*m.tw+m.off)*6;
      var my=sun.y+sn*m.dist;
      if(mx<0||mx>W||my<0||my>H) continue;
      var tw=0.5+0.5*Math.sin(t*m.tw+m.off);
      var al=m.a*tw*a;
      var g=ctx.createRadialGradient(mx,my,0,mx,my,m.r*3.4);
      g.addColorStop(0,'rgba(255,244,205,'+al.toFixed(4)+')');
      g.addColorStop(0.5,'rgba(255,232,170,'+(al*0.5).toFixed(4)+')');
      g.addColorStop(1,'rgba(255,220,150,0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(mx,my,m.r*3.4,0,TAU); ctx.fill();
    }
  }

  function drawGlass(t,dt,a){
    if(a<=0.002) return;
    /* 柔和光晕（lighter 发光感） */
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=a;
    for(var i=0;i<orbs.length;i++){
      var o=orbs[i];
      o.x+=o.vx; o.y+=o.vy;
      if(o.x<-o.r) o.x=W+o.r; if(o.x>W+o.r) o.x=-o.r;
      if(o.y<-o.r) o.y=H+o.r; if(o.y>H+o.r) o.y=-o.r;
      var br=0.8+0.2*Math.sin(t*o.sp+o.off);
      var g=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,o.r);
      g.addColorStop(0,'rgba('+o.c[0]+','+o.c[1]+','+o.c[2]+','+(o.a*br).toFixed(4)+')');
      g.addColorStop(1,'rgba('+o.c[0]+','+o.c[1]+','+o.c[2]+',0)');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(o.x,o.y,o.r,0,TAU); ctx.fill();
    }
    /* 浮尘 */
    for(var k=0;k<dust.length;k++){
      var d=dust[k];
      d.y+=d.vy*dt; d.x+=d.vx*dt;
      if(d.y<-12){ d.y=H+12; d.x=Math.random()*W; }
      if(d.x<-12) d.x=W+12; if(d.x>W+12) d.x=-12;
      var tw=0.6+0.4*Math.sin(t*d.tw+d.off);
      var da=d.a*tw;
      var g2=ctx.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r*3.2);
      g2.addColorStop(0,'rgba(255,255,255,'+da.toFixed(3)+')');
      g2.addColorStop(1,'rgba(210,224,255,0)');
      ctx.fillStyle=g2;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r*3.2,0,TAU); ctx.fill();
    }
    /* 丁达尔光束（斜射光带，先画使玻璃面板浮于其上） */
    drawGodRays(t,a);
    drawGodMotes(t,dt,a);
    /* 小太阳（右上角，发光体置于光束之上） */
    drawSun(t,a);
    ctx.globalCompositeOperation='source-over';
    /* 玻璃面板：半透明 + 高光描边，模拟毛玻璃层次 */
    for(var p=0;p<panes.length;p++){
      var pp=panes[p];
      pp.x+=pp.vx; pp.y+=pp.vy;
      if(pp.x<-pp.w) pp.x=W+pp.w; if(pp.x>W+pp.w) pp.x=-pp.w;
      if(pp.y<-pp.h) pp.y=H+pp.h; if(pp.y>H+pp.h) pp.y=-pp.h;
      var br2=0.75+0.25*Math.sin(t*pp.sp+pp.off);
      var ga=pp.a*br2*a;
      ctx.save();
      ctx.translate(pp.x+pp.w/2,pp.y+pp.h/2);
      ctx.rotate(pp.rot);
      ctx.translate(-pp.w/2,-pp.h/2);
      /* 玻璃主体 */
      var g3=ctx.createLinearGradient(0,0,0,pp.h);
      g3.addColorStop(0,'rgba(255,255,255,'+(ga*0.9).toFixed(4)+')');
      g3.addColorStop(1,'rgba(220,235,255,'+(ga*0.5).toFixed(4)+')');
      rr(0,0,pp.w,pp.h,pp.r);
      ctx.fillStyle=g3; ctx.fill();
      /* 描边 + 顶部高光 */
      ctx.strokeStyle='rgba(255,255,255,'+(pp.hi*br2*a*1.2).toFixed(4)+')';
      ctx.lineWidth=1.2; ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(pp.r*0.6,1.5);
      ctx.lineTo(pp.w-pp.r*0.6,1.5);
      ctx.strokeStyle='rgba(255,255,255,'+(pp.hi*br2*a*1.5).toFixed(4)+')';
      ctx.lineWidth=2.4; ctx.stroke();
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }

  /* ============ 夜间渲染（赛博朋克机甲） ============ */
  function drawCyber(t,dt,a){
    if(a<=0.002) return;
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=a;

    /* 透视霓虹网格（synthwave 地平线 + 放射线，缓慢向前滚动）
       透明度由 0.14 降至 0.085：网格只作质感底纹，不与正文抢视觉 */
    var horizonY=H*0.58;
    var scroll=(t*0.16)%1;
    ctx.lineWidth=1;
    ctx.strokeStyle='rgba(34,211,238,0.085)';
    ctx.beginPath();
    var n=18;
    for(var i=0;i<=n;i++){
      var f=(i-scroll)/n;
      if(f<=0) continue;
      var yy=horizonY+(H-horizonY)*f*f;
      ctx.moveTo(0,yy); ctx.lineTo(W,yy);
    }
    var nv=30;
    for(var v=-nv;v<=nv;v++){
      var xb=W/2+v*(W/nv)*1.5;
      ctx.moveTo(W/2,horizonY); ctx.lineTo(xb,H);
    }
    ctx.stroke();

    /* 棱镜色散光线（从中心向外辐射的彩色霓虹线） */
    ctx.lineCap='round';
    for(var r2=0;r2<rays.length;r2++){
      var rr2=rays[r2];
      rr2.dist+=rr2.speed*dt;
      var maxD=Math.hypot(W,H)*0.72;
      if(rr2.dist-rr2.len>maxD){ rr2.dist=20; rr2.angle=Math.random()*TAU; }
      var cx=W/2, cy=H*0.46;
      var cs=Math.cos(rr2.angle), sn=Math.sin(rr2.angle);
      var x1=cx+cs*(rr2.dist-rr2.len), y1=cy+sn*(rr2.dist-rr2.len);
      var x2=cx+cs*rr2.dist, y2=cy+sn*rr2.dist;
      var fade=Math.min(1,rr2.dist/150);
      var g4=ctx.createLinearGradient(x1,y1,x2,y2);
      g4.addColorStop(0,'rgba('+rr2.color[0]+','+rr2.color[1]+','+rr2.color[2]+',0)');
      g4.addColorStop(1,'rgba('+rr2.color[0]+','+rr2.color[1]+','+rr2.color[2]+','+(rr2.a*fade).toFixed(3)+')');
      ctx.strokeStyle=g4; ctx.lineWidth=rr2.w;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    }

    /* 霓虹散景光斑 */
    for(var b2=0;b2<bokehs.length;b2++){
      var b=bokehs[b2];
      b.x+=b.vx; b.y+=b.vy;
      if(b.x<0) b.x=W; if(b.x>W) b.x=0;
      if(b.y<0) b.y=H; if(b.y>H) b.y=0;
      var btw=0.5+0.5*Math.sin(t*b.tw+b.off);
      var ba=b.a*btw;
      var g5=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r*2.4);
      g5.addColorStop(0,'rgba('+b.c[0]+','+b.c[1]+','+b.c[2]+','+ba.toFixed(3)+')');
      g5.addColorStop(1,'rgba('+b.c[0]+','+b.c[1]+','+b.c[2]+',0)');
      ctx.fillStyle=g5;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r*2.4,0,TAU); ctx.fill();
    }

    /* 中心冷光晕 */
    var cr=Math.min(W,H)*0.36;
    var cg=ctx.createRadialGradient(W/2,H*0.46,0,W/2,H*0.46,cr);
    cg.addColorStop(0,'rgba(120,80,255,0.065)');
    cg.addColorStop(0.5,'rgba(255,43,214,0.03)');
    cg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=cg;
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
  }

  function draw(now){
    var t=now*0.001;
    var dt=lastNow?Math.min((now-lastNow)/16.7,3):1;

    /* 平滑过渡：themeMix 缓动逼近目标 */
    var target=isDark()?1:0;
    if(themeMix!==target){
      themeMix+=(target-themeMix)*0.055;
      if(Math.abs(target-themeMix)<0.001) themeMix=target;
    }

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);

    drawGlass(t,dt,1-themeMix);
    drawCyber(t,dt,themeMix);
    lastNow=now;
  }

  function drawOnce(){
    var now=(window.performance&&performance.now)?performance.now():Date.now();
    var t=now*0.001;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    drawGlass(t,0,1-themeMix);
    drawCyber(t,0,themeMix);
  }

  function loop(now){
    if(!running) return;
    draw(now);
    rafId=window.requestAnimationFrame(loop);
  }
  function start(){
    if(running) return;
    running=true; lastNow=0;
    rafId=window.requestAnimationFrame(loop);
  }
  function stop(){
    running=false;
    if(rafId){ window.cancelAnimationFrame(rafId); rafId=null; }
  }

  /* 减少动效：只渲染静态一帧，主题变化时重绘一次 */
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    themeMix=isDark()?1:0;
    resize();
    drawOnce();
    if(window.MutationObserver){
      new MutationObserver(function(){
        themeMix=isDark()?1:0;
        drawOnce();
      }).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
    }
    return;
  }

  var resizeTimer=null;
  window.addEventListener('resize',function(){
    if(resizeTimer) clearTimeout(resizeTimer);
    resizeTimer=setTimeout(function(){ resize(); },140);
  });

  document.addEventListener('visibilitychange',function(){
    if(document.hidden) stop();
    else if(!document.body.classList.contains('locked')) start();
  });

  function watchIntro(){
    if(document.body.classList.contains('locked')){
      setTimeout(watchIntro,320);
    }else{
      start();
    }
  }

  themeMix=isDark()?1:0;
  resize();
  if(document.body.classList.contains('locked')) watchIntro();
  else start();
})();
</script>

  function mk(tag,opts,children){
    var node=document.createElement(tag); opts=opts||{};
    if(opts.class) node.className=opts.class;
    if(opts.text!==undefined&&opts.text!==null) node.textContent=opts.text;
    if(opts.html!==undefined) node.innerHTML=opts.html;
    if(opts.attrs) for(var k in opts.attrs){
      if(opts.attrs[k]===null||opts.attrs[k]===undefined) continue;
      node.setAttribute(k,opts.attrs[k]);
    }
    if(opts.style) for(var s in opts.style) node.style.setProperty(s,opts.style[s]);
    if(opts.on) for(var ev in opts.on) node.addEventListener(ev,opts.on[ev]);
    if(children) (Array.isArray(children)?children:[children]).forEach(function(c){ if(c) node.appendChild(c); });
    return node;
  }

  /* ============================================================
     彩带粒子引擎（原生 Canvas，点击「复制邮箱 / 打招呼」时触发）
     · 只用 transform/canvas 绘制，不触发布局重排，稳定 60fps
     · 粒子耗尽自动停止 rAF，空闲零开销
     ============================================================ */
  var FX=(function(){
    var canvas=document.getElementById('fxCanvas');
    if(!canvas) return {burst:function(){}};
    var ctx=canvas.getContext('2d');
    var TAU=Math.PI*2;
    var W=0,H=0,DPR=1;
    var parts=[];
    var raf=null;
    var COLORS=['#22d3ee','#34d399','#10b981','#06b6d4','#2dd4bf','#818cf8','#f59e0b','#f472b6','#fbbf24','#ffffff'];

    function resize(){
      DPR=Math.min(window.devicePixelRatio||1,2);
      W=window.innerWidth; H=window.innerHeight;
      canvas.width=Math.max(1,Math.round(W*DPR));
      canvas.height=Math.max(1,Math.round(H*DPR));
      canvas.style.width=W+'px'; canvas.style.height=H+'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
    }

    function burst(x,y,n){
      if(reduceMotion()) return;
      n=n||96;
      for(var i=0;i<n;i++){
        var ang=Math.random()*TAU;
        var sp=2.6+Math.random()*7.6;
        parts.push({
          x:x, y:y,
          vx:Math.cos(ang)*sp,
          vy:Math.sin(ang)*sp-3.4,
          g:0.16+Math.random()*0.08,
          w:5+Math.random()*6,
          h:3+Math.random()*5,
          rot:Math.random()*TAU,
          vr:(Math.random()-.5)*0.34,
          c:COLORS[(Math.random()*COLORS.length)|0],
          life:1,
          decay:0.009+Math.random()*0.008,
          shape:Math.random()<0.22?'circle':'rect',
          sway:Math.random()*TAU
        });
      }
      if(parts.length>520) parts.splice(0,parts.length-520);
      if(!raf) raf=window.requestAnimationFrame(loop);
    }

    function loop(){
      ctx.clearRect(0,0,W,H);
      for(var i=parts.length-1;i>=0;i--){
        var p=parts[i];
        p.vx*=0.985;
        p.vy=p.vy*0.985+p.g;
        p.x+=p.vx+Math.sin(p.sway+=0.09)*0.6;
        p.y+=p.vy;
        p.rot+=p.vr;
        p.life-=p.decay;
        if(p.life<=0||p.y>H+40){ parts.splice(i,1); continue; }
        ctx.save();
        ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle=p.c;
        if(p.shape==='circle'){
          ctx.beginPath(); ctx.arc(0,0,p.w/2,0,TAU); ctx.fill();
        }else{
          /* 纸片翻面闪烁：高度随相位伸缩 */
          var hh=Math.max(1,p.h*Math.abs(Math.sin(p.sway*1.4)));
          ctx.fillRect(-p.w/2,-hh/2,p.w,hh);
        }
        ctx.restore();
      }
      if(parts.length) raf=window.requestAnimationFrame(loop);
      else { raf=null; ctx.clearRect(0,0,W,H); }
    }

    window.addEventListener('resize',function(){ resize(); },{passive:true});
    resize();
    return {burst:burst};
  })();

  /* 光标位置气泡反馈 */
  function bubbleAt(x,y,text){
    var b=document.createElement('div');
    b.className='fxBubble';
    b.textContent=text;
    b.style.left=x+'px';
    b.style.top=y+'px';

    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); },2100);
  }

  /* 在事件光标处发射彩带 + 弹出气泡 */
  function fxAt(ev,msg){
    var x=0,y=0;
    if(ev&&typeof ev.clientX==='number'&&(ev.clientX||ev.clientY)){
      x=ev.clientX; y=ev.clientY;
    }else if(ev&&ev.currentTarget&&ev.currentTarget.getBoundingClientRect){
      var r=ev.currentTarget.getBoundingClientRect();
      x=r.left+r.width/2; y=r.top+r.height/2;
    }else{
      x=window.innerWidth/2; y=window.innerHeight/2;
    }
    FX.burst(x,y);
    bubbleAt(x,y,msg);
  }

  /* ============================================================
     顶部滚动进度条：rAF 节流 + transform:scaleX（零重排）
     ============================================================ */
  function initProgress(){
    var fill=document.getElementById('progressFill');
    if(!fill) return;
    var ticking=false;
    function update(){
      var doc=document.documentElement;
      var max=(doc.scrollHeight-window.innerHeight)||1;
      var y=window.pageYOffset||doc.scrollTop||0;
      var p=Math.min(1,Math.max(0,y/max));
      fill.style.transform='scaleX('+p.toFixed(4)+')';
      ticking=false;
    }
    window.addEventListener('scroll',function(){
      if(!ticking){ ticking=true; window.requestAnimationFrame(update); }
    },{passive:true});
    window.addEventListener('resize',function(){
      if(!ticking){ ticking=true; window.requestAnimationFrame(update); }
    },{passive:true});
    update();
  }

  function initTypewriter(){
    var el=document.getElementById('typeText');
    if(!el) return;
    if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      el.textContent=TYPE_ROLES[0];
      return;
    }
    var ri=0,ci=0,deleting=false;
    function tick(){
      var word=TYPE_ROLES[ri];
      if(!deleting){
        ci++;
        el.textContent=word.slice(0,ci);
        if(ci===word.length){ deleting=true; setTimeout(tick,1900); return; }
        setTimeout(tick,105+Math.random()*75);   /* 打出：轻快且略带节奏 */
      }else{
        ci--;
        el.textContent=word.slice(0,ci);
        if(ci===0){
          deleting=false;
          ri=(ri+1)%TYPE_ROLES.length;
          setTimeout(tick,420);                   /* 换词前短暂停顿 */
          return;
        }
        setTimeout(tick,46);                      /* 删除：更利落 */
      }
    }
    setTimeout(tick,700);
  }

  /* ============================================================

     · 支持滚动进出重复触发（滚出复位、滚入重播）
     · 降级策略：库未加载或不支持时元素保持默认可见

  function reduceMotion(){

  /* 数字滚动：进入视口后从 0 累加到目标值 */
  function animateCounters(){
    var nums=document.querySelectorAll('#statsGrid .stat .num-v');
    if(!nums.length) return;
    if(reduceMotion()||!('IntersectionObserver' in window)) return;
    var io=new IntersectionObserver(function(entries,obs){
      entries.forEach(function(en){
        if(!en.isIntersecting) return;
        var el=en.target;
        obs.unobserve(el);
        var target=parseFloat(String(el.textContent).replace(/[^\d.]/g,''));
        if(isNaN(target)) return;
        var dec=(String(el.textContent).split('.')[1]||'').length;
        var t0=null, dur=1100;
        function step(ts){
          if(!t0) t0=ts;
          var p=Math.min((ts-t0)/dur,1);
          var e=1-Math.pow(1-p,3);
          el.textContent=(target*e).toFixed(dec);
          if(p<1) requestAnimationFrame(step);
          else el.textContent=target.toFixed(dec);
        }
        requestAnimationFrame(step);
      });
    },{threshold:.4});
    nums.forEach(function(n){ io.observe(n); });
  }

  /* —— 技能矩阵：4 组用 4 种不同图形，避免单一进度条 —— */
  var RING_R=20, OV_R=22;

  function ringSvg(pct,r,trackCls,progCls){
    var R=r||OV_R, C=(2*Math.PI*R).toFixed(2);
    var box=(R+6)*2;
    var s=document.createElementNS('http://www.w3.org/2000/svg','svg');
    s.setAttribute('viewBox','0 0 '+box+' '+box);
    s.setAttribute('aria-hidden','true');
    var cx=box/2;
    var t=document.createElementNS('http://www.w3.org/2000/svg','circle');
    t.setAttribute('cx',String(cx));t.setAttribute('cy',String(cx));t.setAttribute('r',String(R));
    t.setAttribute('class',trackCls);
    var p=document.createElementNS('http://www.w3.org/2000/svg','circle');
    p.setAttribute('cx',String(cx));p.setAttribute('cy',String(cx));p.setAttribute('r',String(R));
    p.setAttribute('class',progCls);
    p.style.setProperty('--circ',C);
    p.style.setProperty('--p',String(pct));
    s.appendChild(t);s.appendChild(p);
    return s;
  }

  function initTheme(){
    var rootEl=document.documentElement;
    var btn=document.getElementById('themeBtn');
    var mq=window.matchMedia('(prefers-color-scheme: dark)');
    var saved=null;
    try{ saved=localStorage.getItem('resume-theme'); }catch(e){ saved=null; }

    /* 按当前时间推断昼夜：6:00–18:00 视为白天，其余为夜间 */
    function themeByClock(){
      var h=new Date().getHours();
      return (h>=6&&h<18)?'light':'dark';
    }

    var themeBooted=false;   /* 首次加载直接落定，避免初始闪烁 */
    var themeAnimTimer=null;
    function apply(theme,persist){
      var animate=themeBooted;   /* 之后发生的切换才启用平滑过渡 */
      if(animate) rootEl.classList.add('theme-anim');
      rootEl.setAttribute('data-theme',theme);
      var isDark=theme==='dark';
      btn.innerHTML='<span class="ico-wrap">'+svg(isDark?'sun':'moon',18)+'</span>';
      btn.setAttribute('aria-label',isDark?'切换到浅色模式':'切换到深色模式');
      btn.setAttribute('title',isDark?'切换到浅色模式':'切换到深色模式');
      var meta=document.querySelector('meta[name="theme-color"]');
      if(meta) meta.setAttribute('content',isDark?'#05070f':'#eef2fa');
      if(persist){ try{ localStorage.setItem('resume-theme',theme); }catch(e){} }
      if(animate){
        if(themeAnimTimer) clearTimeout(themeAnimTimer);
        themeAnimTimer=setTimeout(function(){
          rootEl.classList.remove('theme-anim');
          themeAnimTimer=null;
        },700);
      }
      themeBooted=true;
    }

    /* 优先级：手动保存 > 系统偏好 > 时钟推断 */
    apply(saved || (mq.matches?'dark':themeByClock()),false);

    btn.addEventListener('click',function(){
      var next=rootEl.getAttribute('data-theme')==='dark'?'light':'dark';
      apply(next,true);
    });

    var onSys=function(e){
      var cur=null;
      try{ cur=localStorage.getItem('resume-theme'); }catch(err){ cur=null; }
      if(!cur) apply(e.matches?'dark':'light',false);
    };
    if(mq.addEventListener) mq.addEventListener('change',onSys);
    else if(mq.addListener) mq.addListener(onSys);

    /* 无手动设置时，每 60s 按时钟复核一次，实现跨时段自动切换 */
    setInterval(function(){
      var cur=null;
      try{ cur=localStorage.getItem('resume-theme'); }catch(err){ cur=null; }
      if(!cur){
        var want=themeByClock();
        if(rootEl.getAttribute('data-theme')!==want) apply(want,false);
      }
    },60000);
  }

    function push(el){ layer.appendChild(el); }
    function div(cls,html){ var d=document.createElement('div'); d.className=cls; if(html) d.innerHTML=html; return d; }

    /* 1. 柔和光斑 */
    push(div('e-orb o1')); push(div('e-orb o2')); push(div('e-orb o3'));

    /* 2. 刻度尺：每 6vh 一格，每 4 格一个主刻度 */
    ['l','r'].forEach(function(side){
      var ruler=document.createElement('div');
      ruler.className='e-ruler '+side;
      for(var i=0;i<=17;i++){
        var s=document.createElement('span');
        var isMajor=(i%4===0);

        s.style.top=(i*6)+'%';
        if(side==='l') s.style.left='0'; else s.style.right='0';
        ruler.appendChild(s);

    /* 3. 竖排标签 */

      w.setAttribute('viewBox',vb);
      w.setAttribute('class','e-shape '+cls);
      w.setAttribute('fill','none');

    push(shape('e-sh3','0 0 80 80',

    push(shape('e-sh4','0 0 96 96',
      '<line x1="8" y1="88" x2="88" y2="88" class="dim"/>'+

  }

  /* ============================================================
     封面 / 菜单模式：默认隐藏全部正文，点击木琴上的花体字显示对应板块
     · 「概要」→ 第一个板块（首屏），其余依次对应各分区
     · 花体字由木琴模块渲染，点击时派发 xylo:select 事件
     ============================================================ */
  var LABEL_SECTION={
    '概要':'#top','亮点':'#highlights','证书':'#awards','经历':'#experience',
    '项目':'#projects','技能':'#skills','教育':'#education','评价':'#about'
  };
  function menuSections(){
    return Array.prototype.slice.call(document.querySelectorAll('main > .section'));
  }
  function showSection(sel){
    if(!sel||sel.charAt(0)!=='#') return false;
    var target=document.getElementById(sel.slice(1));
    if(!target) return false;
    menuSections().forEach(function(s){ s.classList.toggle('is-active',s===target); });
    document.body.classList.add('menu');
    document.body.classList.add('focus');
    window.scrollTo(0,0);
    /* 板块此前处于 display:none，需重新武装才能播放渐入动画 */
    if(window.ScrollFX&&window.ScrollFX.arm) window.ScrollFX.arm(target);
    /* 兜底：仍停留在初始隐藏态的可见元素直接显示，避免出现空白板块 */
    window.setTimeout(function(){
      Array.prototype.forEach.call(target.querySelectorAll('.rv-armed'),function(el){
        var r=el.getBoundingClientRect();
        if(r.top<window.innerHeight+40&&r.bottom>-40){ el.classList.remove('rv-armed'); el.classList.add('rv-in'); }
      });
    },80);
    var id='#'+target.id;
    Array.prototype.forEach.call(document.querySelectorAll('.nav-link'),function(a){
      a.classList.toggle('active',a.getAttribute('href')===id);
    });
    return true;
  }
  function showCover(){
    menuSections().forEach(function(s){ s.classList.remove('is-active'); });
    document.body.classList.add('menu');
    document.body.classList.remove('focus');
    window.scrollTo(0,0);
    Array.prototype.forEach.call(document.querySelectorAll('.nav-link'),function(a){ a.classList.remove('active'); });
  }
  function initMenu(){
    document.body.classList.add('menu');
    /* 木琴花体字点击（由木琴模块派发 xylo:select） */
    window.addEventListener('xylo:select',function(e){
      var d=(e&&e.detail)||{};
      showSection(d.target||LABEL_SECTION[d.text]);
    });
    /* 顶部导航同样切换板块 */
    Array.prototype.forEach.call(document.querySelectorAll('.nav-link'),function(a){
      a.addEventListener('click',function(ev){
        if(showSection(a.getAttribute('href')||'')) ev.preventDefault();
      });
    });
    /* 品牌标识：返回封面 */
    var brand=document.querySelector('.brand');
    if(brand) brand.addEventListener('click',function(ev){ ev.preventDefault(); showCover(); });
    var back=document.getElementById('coverBack');
    if(back) back.addEventListener('click',showCover);
    /* Esc 退出聚焦，回到封面 */
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'&&document.body.classList.contains('focus')) showCover();
    });
  }

  function init(){
    renderNav();
    initMenu();
    renderSecTitles();
    renderHero();
    renderHighlights();
    renderAwards();
    renderExperience();
    renderProjects();
    renderSkills();
    renderSkillOverview();
    renderEducation();
    renderEvaluation();
    renderFooter();
    initTheme();
    initPrint();
    initLightbox();
    initScroll();
    initTypewriter();
    initProgress();
    initParallax();
    renderEdgeDecor();
    watchEnter();
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
</body>

</html>
